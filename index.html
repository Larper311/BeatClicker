<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Geometrical Dash</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;object-fit:contain}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff}
#menu{background:rgba(0,0,0,.45)}#lv{background:rgba(0,0,0,.85);z-index:5;overflow:auto;justify-content:flex-start;padding-top:30px}
h1{font-size:64px;margin:0 0 14px;text-shadow:0 4px 0 #000;-webkit-text-stroke:3px #000;paint-order:stroke fill}
button,select,input{font:600 13px Arial}
.b{background:#123;color:#fff;border:2px solid #6cf;border-radius:6px;padding:7px 11px;cursor:pointer}
.b:hover,.b.on{background:#6cf;color:#012}
.big{font-size:22px;padding:13px 30px;min-width:300px}
#bar{position:fixed;left:0;right:0;bottom:0;display:none;gap:5px;flex-wrap:wrap;align-items:center;padding:6px;background:rgba(0,10,25,.94);border-top:2px solid #6cf;color:#fff;z-index:3}
#bar i{width:2px;height:26px;background:#6cf;margin:0 3px}
.row{display:flex;gap:6px;align-items:center;background:#0a1a2a;border:1px solid #6cf;padding:6px 10px;border-radius:6px;min-width:520px;color:#fff}
.row span{flex:1}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#6cf;color:#012;padding:8px 18px;border-radius:6px;font-weight:700;display:none;z-index:9}
#tlbar{position:fixed;left:0;right:0;bottom:52px;height:48px;background:rgba(0,8,20,.95);border-top:2px solid #6cf;display:none;z-index:4;padding:4px 8px;color:#fff;font:12px Arial}
#tltrack{position:relative;height:28px;background:#0a1525;border:1px solid #3a6a9a;border-radius:4px;margin-top:4px;cursor:pointer}
.tlkey{position:absolute;top:2px;width:10px;height:24px;border-radius:2px;cursor:pointer;transform:translateX(-50%)}
.tlkey.sel{outline:2px solid #ff0}
</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="menu" class="ov"><h1>GEOMETRICAL DASH</h1>
<button class="b big" id="mPlay">Play Level 1</button>
<button class="b big" id="mEdit">Level Editor (new)</button>
<button class="b big" id="mCont">Continue editing</button>
<button class="b big" id="mLv">My Levels</button>
<button class="b big" id="mFx">Shading FX</button>
<div style="font-size:14px;opacity:.85">Space / Click / Up = jump (hold) &nbsp; Esc = back &nbsp; M = mute</div></div>
<div id="lv" class="ov"></div>
<div id="bar"></div>
<div id="tlbar">
  <div style="display:flex;gap:8px;align-items:center">
    <b>Timeline</b>
    <button class="b" id="tlAddC">+ Color</button>
    <button class="b" id="tlAddF">+ Flash</button>
    <button class="b" id="tlDel">Delete key</button>
    <span id="tlInfo">Click track to add / select keyframe</span>
    <input id="tlHue" type="range" min="0" max="359" value="200" style="width:120px">
    <select id="tlType" class="b"><option value="color">Color</option><option value="flash">Flash</option></select>
  </div>
  <div id="tltrack"></div>
</div>
<div id="toast"></div>
<input type="file" id="imp" accept=".json" style="display:none">
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');
const W=1280,H=720,G=600,B=40,SPD=416,GR=5500,JV=960,PADV=1450,CEIL=9*B,PX=300;
// ---------- STORAGE ----------
const mem={};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const lvs=()=>{try{return JSON.parse(ls.get('gd_lv')||'{}')}catch(e){return{}}};
let FX=ls.get('gd_fx')!=='0';
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1600)};
// ---------- BUILT-IN LEVEL ----------
const DEF=[];
const sp=(a,y=0)=>DEF.push({t:'s',x:a,y,w:1,h:1,r:0});
const bl=(a,y,w=1,h=1)=>DEF.push({t:'b',x:a,y,w,h,r:0});
const pad=a=>DEF.push({t:'p',x:a,y:0,w:1,h:1,r:0});
const orb=(a,y)=>DEF.push({t:'o',x:a,y,w:1,h:1,r:0});
const portal=(a,m)=>DEF.push({t:'g',x:a,y:0,w:1,h:3,r:0,m});
[14,20,21,27,28,33].forEach(a=>sp(a));
bl(38,0,1,1);bl(39,0,1,2);bl(40,0,1,3);bl(41,0,1,2);bl(42,0,1,1);sp(46);sp(47);
bl(53,0,4,1);sp(55,1);sp(61);sp(62);
pad(68);sp(70);sp(71);
[80,81,82,83,84].forEach(a=>sp(a));orb(82,1.2);
sp(92);sp(93);bl(98,0,1,1);sp(101);sp(102);bl(106,0,2,2);sp(110);sp(111);sp(115);
portal(120,'ship');
[[130,3,0],[138,0,4],[146,4,3],[154,2,4],[162,5,0],[168,0,5],[176,3,3],[184,1,5],[192,5,1]].forEach(([a,f,c])=>{if(f)bl(a,0,2,f);if(c)bl(a,9-c,2,c)});
portal(205,'cube');
sp(212);sp(213);bl(218,0,3,1);sp(224);sp(225);pad(231);sp(234);sp(235);bl(240,0,1,1);bl(241,0,1,2);sp(244);sp(250);sp(251);
[[60,2],[88,2],[150,4.5],[236,2]].forEach(([a,y])=>DEF.push({t:'n',x:a,y,w:1,h:1,r:0}));
[[30,5,200],[100,6,300],[160,8,320],[230,6,160]].forEach(([a,y,m])=>DEF.push({t:'l',x:a,y,w:1,h:1,r:0,m}));
DEF.forEach(o=>{if(o.t==='b')o.k=o.x>125&&o.x<200?3:1;if(o.t==='s'&&o.x>210)o.k=2});
// ---------- COMPILE ----------
let L=[],END=255,COINS=0,TLKEYS=[];
function hr(o){const b=o.t==='v'?[11,0,18,14]:[9,0,22,28];let xs=[b[0]-20,b[0]+b[2]-20],ys=[b[1]-20,b[1]+b[3]-20];
  for(let i=0;i<(o.r|0);i++){const nx=ys,ny=xs.map(v=>-v);xs=nx;ys=ny}
  return[o.x+20+Math.min(...xs),o.y+20+Math.min(...ys),Math.abs(xs[1]-xs[0]),Math.abs(ys[1]-ys[0])]}
function loadLevel(d,tl){
  L=d.map(o=>{const q={...o,x:o.x*B,y:o.y*B,w:o.w*B,h:o.h*B,used:false};if(q.t==='s'||q.t==='v')q.hb=hr(q);return q}).sort((a,b)=>a.x-b.x);
  COINS=d.filter(o=>o.t==='n').length;
  END=Math.max(30,Math.max(...d.map(o=>o.x+o.w))+8);
  TLKEYS=Array.isArray(tl)?tl.slice().sort((a,b)=>a.p-b.p):[];
}
const px=o=>({...o,x:o.x*B,y:o.y*B,w:o.w*B,h:o.h*B});
// ---------- STATE ----------
let state='menu',hold=false,pressed=false,attempt=0,best=0,deadT=0,flash=0,shake=0,P,parts=[],acc=0,last=0,startX=0,bgh=220,lvOpen=false;
P={x:0,y:0,vy:0,rot:0,mode:'cube',gr:true,sp:1,size:1,dir:1,mirror:false};
function reset(sx=startX){
  startX=sx;
  P={x:sx,y:0,vy:0,rot:0,mode:'cube',gr:true,sp:1,size:1,dir:1,mirror:false,coins:0,coy:0,dashT:0};
  L.forEach(o=>{o.used=false;
    if(o.x<sx){
      if(o.t==='g'){applyPortal(o);o.used=true}
      if(o.t==='d'){P.sp=o.m||1;o.used=true}
      if(o.t==='sz'){P.size=o.m||1;o.used=true}
    }
  });
  parts=[];attempt++;state='play';flash=0;show();
  if(ac){nt=ac.currentTime+.05;ns=0;musicRun=true}
}
function applyPortal(o){
  if(o.m==='ship'||o.m==='cube'||o.m==='ball'||o.m==='ufo'||o.m==='wave')P.mode=o.m;
  else if(o.m==='grav'){P.gr=!P.gr;P.vy*=-0.4}
  else if(o.m==='mirror')P.mirror=!P.mirror;
  else if(o.m==='rev')P.dir*=-1;
}
function die(){
  if(state!=='play')return;
  state='dead';deadT=.8;flash=.5;shake=.25;musicRun=false;best=Math.max(best,pct());
  for(let i=0;i<30;i++){const a=Math.random()*6.28,s=150+Math.random()*450;parts.push({x:P.x+20,y:P.y+20,vx:Math.cos(a)*s,vy:Math.sin(a)*s+150,life:.7,sz:6+Math.random()*8,c:'#5ef'})}
  if(ac){const t=ac.currentTime;tone(200,t,.35,'sawtooth',.25);tone(90,t,.45,'square',.2)}
}
const pct=()=>Math.min(100,Math.floor(P.x/(END*B)*100));
function show(){
  $('menu').style.display=state==='menu'&&!lvOpen?'flex':'none';
  $('bar').style.display=state==='edit'?'flex':'none';
  $('tlbar').style.display=state==='edit'?'block':'none';
  const ip=$('insp');if(ip)ip.style.display=state==='edit'&&!lvOpen?'flex':'none';
  $('lv').style.display=lvOpen?'flex':'none';
}
function leave(){musicRun=false;state=ed.testing?'edit':'menu';ed.testing=false;show()}
// ---------- AUDIO ----------
let ac,mOn=true,nt=0,ns=0,musicRun=false;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)}
const bass=[55,55,65.4,49],scale=[220,261.6,329.6,392,440,392,329.6,261.6];
setInterval(()=>{if(!ac||!musicRun||!mOn)return;while(nt<ac.currentTime+.2){if(ns%2==0)kick(nt);tone(bass[(ns>>3)%4],nt,.18,'sawtooth',.08);if(ns%2==1||ns%8==4)tone(scale[(ns*3)%8],nt,.12,'square',.035);nt+=.2;ns++}},30);
// ---------- GAME INPUT ----------
const keys={};
const JK=['Space','ArrowUp','KeyW'];
function press(){audio();if(state==='win'){leave();return}if(state==='play'){hold=true;pressed=true}}
addEventListener('mousedown',e=>{if(e.target===cv&&(state==='play'||state==='win'))press()});
addEventListener('mouseup',()=>{hold=false});
addEventListener('touchstart',e=>{if(e.target===cv&&(state==='play'||state==='win')){e.preventDefault();press()}},{passive:false});
addEventListener('touchend',()=>{hold=false});
addEventListener('keyup',e=>{keys[e.code]=false;if(JK.includes(e.code))hold=false});
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyM'&&e.target.tagName!=='INPUT'){mOn=!mOn}
  if(e.code==='Escape'){if(lvOpen){lvOpen=false;show()}else if(state==='edit'){autosave();state='menu';show()}else if(state!=='menu')leave();return}
  if(state==='edit'){if(!lvOpen)editKey(e);return}
  if(JK.includes(e.code)&&state!=='menu'){e.preventDefault();if(!e.repeat)press()}
});
// ---------- PHYSICS ----------
const ov=(ax,ay,aw,ah,bx,by,bw,bh)=>ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
const PV=[1100,1450,1900],OJ=[720,960,1250];
function off(o,t){const m=o.mv;if(!m||!m.a)return[0,0];const a=m.s*t+m.p,r=m.r*B;
  return m.a===1?[0,Math.sin(a)*r]:m.a===2?[Math.sin(a)*r,0]:[Math.cos(a)*r,Math.sin(a)*r]}
function step(dt){
  const oy=P.y,S=SPD*P.sp*P.dir,mt=P.x/SPD;
  P.x+=S*dt;
  P.coy=Math.max(0,P.coy-dt);
  P.dashT=Math.max(0,P.dashT-dt);
  const gDir=P.gr?1:-1;
  const sz=P.size;
  const hitW=B*sz*0.85,hitH=B*sz;

  if(P.mode==='cube'||P.mode==='ball'){
    if(P.coy>0&&hold&&P.mode==='cube'){P.vy=JV*gDir*(sz<1?0.75:1);P.coy=0}
    if(P.mode==='ball'&&pressed){P.gr=!P.gr;P.vy*=-0.35;pressed=false}
    P.vy-=GR*dt*gDir;
    if(Math.abs(P.vy)>1500)P.vy=Math.sign(P.vy)*1500;
  }else if(P.mode==='ship'){
    P.vy+=(hold?2300:-1500)*dt*gDir;
    P.vy=Math.max(-380,Math.min(500,P.vy));
  }else if(P.mode==='ufo'){
    if(pressed){P.vy=JV*0.85*gDir;pressed=false}
    P.vy-=GR*0.7*dt*gDir;
  }else if(P.mode==='wave'){
    P.vy=hold?S*0.85*gDir:-S*0.85*gDir;
  }

  P.y+=P.vy*dt;
  let gr=false;
  const floorY=P.gr?0:CEIL-hitH;
  if(P.gr){
    if(P.y<=0){P.y=0;if(P.vy<0)P.vy=0;gr=true}
    if(P.mode==='ship'&&P.y+hitH>CEIL){P.y=CEIL-hitH;if(P.vy>0)P.vy=0}
  }else{
    if(P.y+hitH>=CEIL){P.y=CEIL-hitH;if(P.vy>0)P.vy=0;gr=true}
    if(P.mode==='ship'&&P.y<0){P.y=0;if(P.vy<0)P.vy=0}
  }

  for(const o of L){
    if(o.t==='k'||o.t==='l')continue;
    const am=o.mv?o.mv.r*B+B:0;
    if(o.x>P.x+120+am||o.x+o.w<P.x-120-am)continue;
    const[mx,my]=off(o,mt),ux=o.x+mx,uy=o.y+my;

    if(o.t==='b'||o.t==='sl'){
      if(ov(P.x+(B-hitW)/2,P.y,hitW,hitH,ux,uy,o.w,o.h)){
        if(o.t==='sl'){ // simple slope boost
          P.vy=Math.max(P.vy,600*gDir);gr=false;
        }else if(P.gr&&oy>=uy+o.h-16&&P.vy<=0){P.y=uy+o.h;P.vy=0;gr=true}
        else if(!P.gr&&oy+hitH<=uy+16&&P.vy>=0){P.y=uy-hitH;P.vy=0;gr=true}
        else if(P.mode==='ship'&&P.gr&&oy+hitH<=uy+14&&P.vy>0){P.y=uy-hitH;P.vy=0}
        else{die();return}
      }
    }else if(o.t==='s'||o.t==='v'){
      const h=o.hb;if(ov(P.x+(B-hitW)/2+4,P.y+4,hitW-8,hitH-8,h[0]+mx,h[1]+my,h[2],h[3])){die();return}
    }else if(o.t==='w'){
      const cx=o.x+20+mx,cy=o.y+20+my,bx=P.x+(B-hitW)/2+4,by=P.y+4;
      const dx=Math.max(bx-cx,0,cx-(bx+hitW-8)),dy=Math.max(by-cy,0,cy-(by+hitH-8));
      if(dx*dx+dy*dy<17*17){die();return}
    }else if(o.t==='p'){
      if(ov(P.x,P.y,B,hitH,ux,uy,B,12)&&!o.used){o.used=true;P.vy=(P.mode==='ship'?700:PV[(o.m||2)-1])*gDir;gr=false}
    }else if(o.t==='o'||o.t==='do'){ // normal orb or dash orb
      if(pressed&&!o.used&&ov(P.x+4,P.y+4,B-8,hitH-8,ux-4,uy-4,B+8,B+8)){
        o.used=true;pressed=false;gr=false;
        if(o.t==='do'){P.vy=0;P.dashT=.35;P.x+= (o.m||1)*180*P.dir}
        else P.vy=OJ[(o.m||2)-1]*gDir;
      }
    }else if(o.t==='n'){
      if(!o.used&&ov(P.x,P.y,B,hitH,ux+6,uy+6,28,28)){o.used=true;P.coins++;if(ac)tone(1200,ac.currentTime,.15,'triangle',.15)}
    }else if(o.t==='g'||o.t==='d'||o.t==='sz'||o.t==='tp'){
      if(!o.used&&P.x+B/2>o.x){
        o.used=true;
        if(o.t==='g')applyPortal(o);
        else if(o.t==='d')P.sp=Math.max(0.5,Math.min(5,o.m||1));
        else if(o.t==='sz')P.size=o.m||1;
        else if(o.t==='tp'){P.x+=(o.m||8)*B;P.coy=0.05}
        if(ac)tone(o.t==='g'?660:550,ac.currentTime,.2,'triangle',.15)
      }
    }
  }
  if(gr)P.coy=.07;P.gr=gr||P.gr; // keep gravity state
  // rotation
  if(P.mode==='cube'||P.mode==='ball'){
    if(!gr)P.rot+=8.6*dt*(P.gr?1:-1);
    else{const tg=Math.round(P.rot/(Math.PI/2))*Math.PI/2;P.rot+=(tg-P.rot)*Math.min(1,dt*30)}
  }else if(P.mode==='wave')P.rot=hold?Math.PI/4:-Math.PI/4;
  else P.rot=-Math.atan2(P.vy,S);

  if(P.x>=END*B){state='win';musicRun=false;best=100;if(ac)[523,659,784,1047].forEach((f,i)=>tone(f,ac.currentTime+i*.1,.4,'triangle',.2))}
  if(P.x<0)P.x=0;
}
// ---------- RENDER ----------
function hueAt(xp){
  // Timeline first
  const prog=xp/(END*B);
  let col=220;
  for(const k of TLKEYS){
    if(k.p<=prog){
      if(k.type==='color')col=k.m;
      if(k.type==='flash'&&state==='play')flash=Math.max(flash,0.45);
    }
  }
  // fallback old color triggers
  const a=state==='edit'?ed.data.map(o=>({x:o.x*B,t:o.t,m:o.m})):L;
  let r=null;
  for(const o of a)if(o.t==='c'&&o.x<=xp&&(!r||o.x>=r.x))r=o;
  return r?r.m:col;
}
const SPC={0.5:'#8af',0.8:'#fa0',1:'#4cf',1.5:'#4f6',2:'#f84',3:'#f44',4:'#f0f',5:'#fff'};
const PC=['#f6c','#ff0','#f44'];
const SK=[
  ['#20202a','#000','#fff'],           // classic
  ['#6f96c8','#142238','#d8ecff'],     // glossy
  ['#021820','#000','h'],              // neon
  ['#b4bcc6','#3a4047','#fff'],        // metal
  ['rgba(170,230,255,.4)','rgba(60,130,210,.3)','#c8f0ff'], // glass
  ['#ff9a2a','#6a0d00','#ffd890'],     // lava
  ['#a8e0ff','#3a8ab0','#e0f8ff'],     // ice
  ['#c45a2a','#4a1800','#ffb070'],     // magma
  ['#8a7a6a','#3a3028','#d0c0a8']      // rock
];
const skin=o=>{const q=SK[o.k|0]||SK[0];return{a:q[0],b:q[1],e:q[2]==='h'?`hsl(${(bgh+180)%360},100%,65%)`:q[2]}};
function tile(tx,ty,w,h,o,t){
  const s=skin(o),k=o.k|0,g=x.createLinearGradient(0,ty,0,ty+h);g.addColorStop(0,s.a);g.addColorStop(1,s.b);
  x.fillStyle=g;x.fillRect(tx,ty,w,h);
  if(FX){x.fillStyle='rgba(255,255,255,.16)';x.fillRect(tx+2,ty+2,w-4,4);x.fillStyle='rgba(0,0,0,.25)';x.fillRect(tx+2,ty+h-6,w-4,4);
    if(k===1||k===3||k===4||k===6){x.save();x.beginPath();x.rect(tx,ty,w,h);x.clip();const p=((t*90+tx*.7+ty*.4)%160)-60;x.fillStyle='rgba(255,255,255,.28)';
      x.beginPath();x.moveTo(tx+p,ty+h);x.lineTo(tx+p+14,ty+h);x.lineTo(tx+p+14+h,ty);x.lineTo(tx+p+h,ty);x.fill();x.restore()}}
  if(FX&&(k===5||k===2||k===7)){x.shadowColor=s.e;x.shadowBlur=10}
  x.strokeStyle=s.e;x.lineWidth=2;x.strokeRect(tx+1,ty+1,w-2,h-2);x.shadowBlur=0;
  x.strokeStyle='rgba(255,255,255,.18)';x.strokeRect(tx+6,ty+6,w-12,h-12);
}
function drawObj(o,sx,by,t,edit){
  const k=o.k|0,s=skin(o);
  if(o.t==='b'||o.t==='k'||o.t==='sl'){
    x.save();if(o.t==='k')x.globalAlpha*=.45;
    if(o.t==='sl'){ // simple triangle ramp
      x.beginPath();x.moveTo(sx,by);x.lineTo(sx+o.w,by);x.lineTo(sx+o.w,by-o.h);x.closePath();
      const g=x.createLinearGradient(sx,by,sx,by-o.h);g.addColorStop(0,s.a);g.addColorStop(1,s.b);

function editKey(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  const k=e.code,c=e.ctrlKey||e.metaKey,sel=[...ed.sel];let h=true;
  if(c&&k==='KeyZ')e.shiftKey?redo():undo();
  else if(c&&k==='KeyY')redo();
  else if(c&&k==='KeyC')copy();
  else if(c&&k==='KeyV'){mposKeep();paste(ed.gx,ed.gy)}
  else if(c&&k==='KeyD'){copy();const w=Math.max(...ed.clip.map(o=>o.x+o.w))-Math.min(...ed.clip.map(o=>o.x));paste(Math.min(...ed.clip.map(o=>o.x))+w,Math.min(...ed.clip.map(o=>o.y)))}
  else if(c&&k==='KeyA'){ed.data.forEach(o=>ed.sel.add(o))}
  else if(c&&k==='KeyS')saveLevel();
  else if(k==='Delete'||k==='Backspace')delSel();
  else if(k==='KeyR'){if(sel.length){snapshot();sel.forEach(o=>{if('sv'.includes(o.t))o.r=((o.r|0)+1)%4});autosave()}else ed.rot=(ed.rot+1)%4}
  else if(k==='KeyG'){ed.snap=ed.snap===1?.5:ed.snap===.5?.25:1;$('snapb').textContent='Snap '+ed.snap}
  else if(k==='KeyP')startTest(e.shiftKey);
  else if(k==='KeyV')setTool('sel');
  else if(k==='KeyE')setTool('era');
  else if(/^Digit\d$/.test(k)){const n=+k[5],i=n===0?11:n+1;if(TL[i])setTool(TL[i].id)}
  else if(k.startsWith('Arrow')&&sel.length){snapshot();const dx=k==='ArrowRight'?1:k==='ArrowLeft'?-1:0,dy=k==='ArrowUp'?1:k==='ArrowDown'?-1:0;sel.forEach(o=>{o.x=Math.max(0,o.x+dx*ed.snap);o.y=Math.max(0,o.y+dy*ed.snap)});autosave()}
  else if(sel.length&&(k==='BracketRight'||k==='BracketLeft'||k==='Minus'||k==='Equal')){snapshot();sel.forEach(o=>{if(o.t!=='b'&&o.t!=='sl')return;
    if(k==='BracketRight')o.w++;if(k==='BracketLeft')o.w=Math.max(1,o.w-1);if(k==='Equal')o.h++;if(k==='Minus')o.h=Math.max(1,o.h-1)});autosave()}
  else if(k==='KeyN')ed.prev=!ed.prev;
  else if(k==='KeyH')ed.hbx=!ed.hbx;
  else if(k==='KeyF'){FX=!FX;ls.set('gd_fx',FX?'1':'0')}
  else h=false;
  if(h)e.preventDefault();
}
const mposKeep=()=>{};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousedown',e=>{
  if(state!=='edit')return;mpos(e);
  if(e.button===1||e.button===2||keys.Space){ed.drag={k:'pan',x:e.clientX,y:e.clientY,cx:ed.cx,cy:ed.cy};return}
  if(e.button!==0)return;
  if(ed.tool==='era'){snapshot();ed.drag={k:'era'};erase()}
  else if(ed.tool==='sel'){const o=at(ed.wx,ed.wy);
    if(o){if(e.shiftKey&&ed.sel.has(o)){ed.sel.delete(o);return}if(!ed.sel.has(o)){if(!e.shiftKey)ed.sel.clear();ed.sel.add(o)}
      snapshot();ed.drag={k:'move',wx:ed.wx,wy:ed.wy,orig:[...ed.sel].map(q=>[q,q.x,q.y])}}
    else{if(!e.shiftKey)ed.sel.clear();ed.drag={k:'box',x0:ed.wx,y0:ed.wy}}}
  else{snapshot();ed.drag={k:'paint'};place()}
});
addEventListener('mousemove',e=>{
  if(state!=='edit')return;mpos(e);const d=ed.drag;if(!d)return;
  if(d.k==='pan'){ed.cx=d.cx-(e.clientX-d.x)/sc()/ed.z;ed.cy=d.cy+(e.clientY-d.y)/sc()}
  else if(d.k==='era')erase();else if(d.k==='paint')place();
  else if(d.k==='move'){const dx=Math.round((ed.wx-d.wx)/B/ed.snap)*ed.snap,dy=Math.round((ed.wy-d.wy)/B/ed.snap)*ed.snap;d.orig.forEach(([o,ox,oy])=>{o.x=Math.max(0,ox+dx);o.y=Math.max(0,oy+dy)})}
});
addEventListener('mouseup',()=>{const d=ed.drag;if(!d)return;
  if(d.k==='box'){const a=Math.min(d.x0,ed.wx)/B,b=Math.max(d.x0,ed.wx)/B,c=Math.min(d.y0,ed.wy)/B,f=Math.max(d.y0,ed.wy)/B;
    ed.data.forEach(o=>{if(o.x<b&&o.x+o.w>a&&o.y<f&&o.y+o.h>c)ed.sel.add(o)})}
  if(d.k!=='pan'&&d.k!=='box')autosave();ed.drag=null});
cv.addEventListener('wheel',e=>{if(state!=='edit')return;e.preventDefault();
  if(e.ctrlKey){ed.z=Math.max(.3,Math.min(2.5,ed.z*(e.deltaY>0?.9:1.1)))}else ed.cx+=(e.deltaY+e.deltaX)*.8/ed.z},{passive:false});
// toolbar
(function(){const bar=$('bar');
  bar.innerHTML=TL.map((t,i)=>`<button class="b tb" data-id="${t.id}">${t.n}</button>`).join('')+
  `<i></i><select id="spd" class="b"><option>0.5</option><option>0.8</option><option selected>1</option><option>1.5</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
  <select id="szsel" class="b"><option value="1">Normal</option><option value="0.6">Mini</option></select>
  <input id="tpd" type="number" value="8" min="2" max="40" style="width:50px" title="Teleport distance">
  <input id="hue" type="range" min="0" max="359" value="200" title="Color / Light hue">
  <button class="b" id="rotb">Rotate (R)</button><button class="b" id="snapb">Snap 1</button><i></i>
  <button class="b" id="undob">Undo</button><button class="b" id="redob">Redo</button><button class="b" id="delb">Delete</button><i></i>
  <input id="nm" value="My Level" style="width:130px;padding:6px"><button class="b" id="saveb">Save</button><button class="b" id="loadb">Load</button><button class="b" id="expb">Export</button><i></i>
  <button class="b" id="testb">Test (P)</button><button class="b" id="testh">Test from cursor</button><button class="b" id="menub">Menu</button>`;
  bar.onclick=e=>{const b=e.target.closest('.tb');if(b)setTool(b.dataset.id)};
  $('spd').onchange=e=>{ed.spd=+e.target.value;if(ed.sel.size){snapshot();ed.sel.forEach(o=>{if(o.t==='d')o.m=ed.spd});autosave()}};
  $('szsel').onchange=e=>{ed.size=+e.target.value;if(ed.sel.size){snapshot();ed.sel.forEach(o=>{if(o.t==='sz')o.m=ed.size});autosave()}};
  $('tpd').onchange=e=>{ed.tpDist=+e.target.value||8};
  $('hue').oninput=e=>{ed.hue=+e.target.value;ed.sel.forEach(o=>{if(o.t==='c'||o.t==='l')o.m=ed.hue})};
  $('rotb').onclick=()=>editKey({code:'KeyR',target:document.body,preventDefault(){}});
  $('snapb').onclick=()=>editKey({code:'KeyG',target:document.body,preventDefault(){}});
  $('undob').onclick=undo;$('redob').onclick=redo;$('delb').onclick=delSel;
  $('nm').oninput=e=>{ed.name=e.target.value.trim()||'Untitled'};
  $('saveb').onclick=saveLevel;$('loadb').onclick=()=>showLevels();$('expb').onclick=()=>dl(ed.name,ed.data,TLKEYS);
  $('testb').onclick=()=>startTest(false);$('testh').onclick=()=>startTest(true);$('menub').onclick=()=>{autosave();state='menu';show()};
  setTool('b');})();
// inspector
const MVT=['b','s','v','w','p','o','n','k','sl','do'];
const insp=document.createElement('div');insp.id='insp';
insp.style.cssText='position:fixed;right:8px;top:58px;width:215px;background:rgba(0,10,25,.92);border:2px solid #6cf;border-radius:8px;padding:8px;color:#fff;font:12px Arial;display:none;z-index:3;flex-direction:column;gap:4px';
insp.innerHTML=`<b>Inspector (applies to selection)</b>
Skin <select id="skn">
<option value="0">Classic</option><option value="1">Glossy</option><option value="2">Neon</option>
<option value="3">Metal</option><option value="4">Glass</option><option value="5">Lava</option>
<option value="6">Ice</option><option value="7">Magma</option><option value="8">Rock</option>
</select>
Pad / Orb power <select id="lvl"><option value="1">Low</option><option value="2" selected>Normal</option><option value="3">High</option></select>
Motion <select id="mva"><option value="0">None</option><option value="1">Up / Down</option><option value="2">Left / Right</option><option value="3">Circle</option></select>
Distance <span id="mvrv">2</span><input id="mvr" type="range" min=".5" max="8" step=".5" value="2">
Speed <span id="mvsv">2</span><input id="mvs" type="range" min=".5" max="6" step=".25" value="2">
Phase / wave step <span id="mvpv">0</span><input id="mvp" type="range" min="0" max="6.28" step=".1" value="0">
<button class="b" id="mvw">Phase wave (stagger)</button><button class="b" id="prvb">Preview motion (N)</button><button class="b" id="hbxb">Hitboxes (H)</button><button class="b" id="fxb">Shading FX (F)</button>`;
document.body.appendChild(insp);
const snapSoft=()=>{if(Date.now()-ed.lastSnap>700)snapshot();ed.lastSnap=Date.now()};
const eachSel=f=>{if(!ed.sel.size)return;snapSoft();ed.sel.forEach(f);autosave()};
const mvSet=(key,val)=>eachSel(o=>{if(!MVT.includes(o.t))return;
  if(key==='a'){if(val){o.mv=o.mv||{a:val,r:+$('mvr').value,s:+$('mvs').value,p:+$('mvp').value};o.mv.a=val}else delete o.mv}else if(o.mv)o.mv[key]=val});
$('skn').onchange=e=>{ed.skin=+e.target.value;eachSel(o=>{if('bsvwksl'.includes(o.t))o.k=ed.skin})};
$('lvl').onchange=e=>{ed.lvl=+e.target.value;eachSel(o=>{if(o.t==='p'||o.t==='o'||o.t==='do')o.m=ed.lvl})};
$('mva').onchange=e=>mvSet('a',+e.target.value);
[['mvr','r'],['mvs','s'],['mvp','p']].forEach(([i,k])=>$(i).oninput=e=>{$(i+'v').textContent=e.target.value;mvSet(k,+e.target.value)});
$('mvw').onclick=()=>{const st=+$('mvp').value||.5;snapshot();[...ed.sel].filter(o=>o.mv).sort((a,b)=>a.x-b.x||a.y-b.y).forEach((o,i)=>o.mv.p=+(i*st).toFixed(2));autosave()};
const fk=c=>editKey({code:c,target:document.body,preventDefault(){}});
$('prvb').onclick=()=>fk('KeyN');$('hbxb').onclick=()=>fk('KeyH');$('fxb').onclick=()=>fk('KeyF');
insp.addEventListener('change',e=>{if(e.target.tagName==='SELECT')e.target.blur()});
insp.addEventListener('mouseup',e=>{if(e.target.type==='range')e.target.blur()});
function syncInsp(){const f=[...ed.sel][0];if(f===ed.lastSel)return;ed.lastSel=f;if(!f)return;
  $('skn').value=f.k|0;if(f.t==='p'||f.t==='o'||f.t==='do')$('lvl').value=f.m||2;const m=f.mv;$('mva').value=m?m.a:0;
  if(m){$('mvr').value=m.r;$('mvs').value=m.s;$('mvp').value=m.p}['mvr','mvs','mvp'].forEach(i=>$(i+'v').textContent=$(i).value)}
// ---------- TIMELINE ----------
function drawTL(){
  const track=$('tltrack');track.innerHTML='';
  TLKEYS.forEach((k,i)=>{
    const d=document.createElement('div');
    d.className='tlkey'+(ed.tlSel===i?' sel':'');
    d.style.left=(k.p*100)+'%';
    d.style.background=k.type==='flash'?'#fff':`hsl(${k.m},80%,55%)`;
    d.title=`${k.type} @ ${(k.p*100).toFixed(1)}%`;
    d.onclick=e=>{e.stopPropagation();ed.tlSel=i;$('tlHue').value=k.m||200;$('tlType').value=k.type;drawTL()};
    track.appendChild(d);
  });
}
$('tltrack').onclick=e=>{
  const r=$('tltrack').getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  snapshot();
  const type=$('tlType').value;
  TLKEYS.push({p,type,m:+$('tlHue').value});
  TLKEYS.sort((a,b)=>a.p-b.p);
  ed.tlSel=TLKEYS.findIndex(k=>k.p===p);
  autosave();drawTL();
};
$('tlAddC').onclick=()=>{$('tlType').value='color';$('tltrack').click()};
$('tlAddF').onclick=()=>{$('tlType').value='flash';$('tltrack').click()};
$('tlDel').onclick=()=>{if(ed.tlSel==null)return;snapshot();TLKEYS.splice(ed.tlSel,1);ed.tlSel=null;autosave();drawTL()};
$('tlHue').oninput=()=>{if(ed.tlSel!=null){TLKEYS[ed.tlSel].m=+$('tlHue').value;drawTL()}};
$('tlType').onchange=()=>{if(ed.tlSel!=null){TLKEYS[ed.tlSel].type=$('tlType').value;drawTL()}};
// ---------- MENUS / LEVELS ----------
function openEditor(data,name,tl){ed.data=JSON.parse(JSON.stringify(data));ed.name=name;$('nm').value=name;TLKEYS=Array.isArray(tl)?tl.slice():[];ed.und=[];ed.red=[];ed.sel.clear();ed.cx=-200;ed.cy=-70;ed.z=1;state='edit';lvOpen=false;show();drawTL()}
function playData(d,tl){loadLevel(d,tl);ed.testing=false;attempt=0;lvOpen=false;reset(0)}
function dl(name,data,tl){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({name,data,tl})],{type:'application/json'}));a.download=name+'.gdash.json';a.click()}
function showLevels(){
  lvOpen=true;const a=lvs(),n=Object.keys(a);const p=$('lv');
  p.innerHTML='<h1 style="font-size:40px">MY LEVELS</h1><div><button class="b" id="lBack">Back</button> <button class="b" id="lImp">Import file</button> <button class="b" id="lDef">Copy Level 1 into editor</button></div>'+
    (n.length?n.map((k,i)=>`<div class="row"><span>${k.replace(/</g,'&lt;')} (${a[k].data.length} objects)</span><button class="b" data-a="p" data-i="${i}">Play</button><button class="b" data-a="e" data-i="${i}">Edit</button><button class="b" data-a="x" data-i="${i}">Export</button><button class="b" data-a="d" data-i="${i}">Delete</button></div>`).join(''):'<div>No saved levels yet. Build one in the editor and press Save!</div>');
  show();
  p.onclick=e=>{const b=e.target;if(b.id==='lBack'){lvOpen=false;show();return}if(b.id==='lImp'){$('imp').click();return}if(b.id==='lDef'){openEditor(DEF,'Level 1 copy',[]);return}
    const k=n[b.dataset.i];if(!k)return;const o=a[k];
    if(b.dataset.a==='p')playData(o.data,o.tl);else if(b.dataset.a==='e')openEditor(o.data,k,o.tl);else if(b.dataset.a==='x')dl(k,o.data,o.tl);
    else if(b.dataset.a==='d'&&confirm('Delete "'+k+'"?')){delete a[k];ls.set('gd_lv',JSON.stringify(a));showLevels()}};
}
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{
  let j=JSON.parse(r.result),d=Array.isArray(j)?j:j.data,nm=(j.name||f.name.replace(/\..*/,'')).slice(0,40),tl=j.tl||[];
  if(!Array.isArray(d)||!d.every(o=>o&&typeof o.t==='string'&&isFinite(o.x)&&isFinite(o.y)))throw 0;
  d=d.map(o=>({w:1,h:1,r:0,...o}));const a=lvs();while(a[nm])nm+=' (2)';a[nm]={data:d,tl,t:Date.now()};ls.set('gd_lv',JSON.stringify(a));toast('Imported "'+nm+'"');showLevels()}catch(er){toast('Invalid level file')}};
  r.readAsText(f);e.target.value=''};
$('mPlay').onclick=()=>{audio();playData(DEF,[])};
$('mEdit').onclick=()=>openEditor([],'My Level',[]);
$('mCont').onclick=()=>{try{const s=JSON.parse(ls.get('gd_auto'));openEditor(s.data,s.name,s.tl)}catch(e){openEditor([],'My Level',[])}};
$('mLv').onclick=()=>showLevels();
const fxt=()=>$('mFx').textContent='Shading FX: '+(FX?'On':'Off');fxt();
$('mFx').onclick=()=>{FX=!FX;ls.set('gd_fx',FX?'1':'0');fxt()};
addEventListener('beforeunload',()=>{if(state==='edit')autosave()});
// ---------- LOOP ----------
loadLevel(DEF,[]);show();
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(state==='menu'){P.x=(ts/1000*SPD*.5)%(60*B);P.y=0;P.rot=0;P.mode='cube';P.gr=true;P.size=1}
  acc+=dt;while(acc>=1/240){if(state==='play')step(1/240);acc-=1/240}
  pressed=false;
  if(state==='dead'){deadT-=dt;if(deadT<=0)reset()}
  if(flash>0)flash=Math.max(0,flash-dt*1.5);if(shake>0)shake-=dt;
  if(state==='edit')syncInsp();
  draw(dt);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
