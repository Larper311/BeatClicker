<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4-Lane Rhythm Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d12;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #game {
    position: relative;
    width: 480px;
    height: 640px;
    background: #15151c;
    border: 3px solid #333;
    overflow: hidden;
  }
  .lane {
    position: absolute;
    top: 0;
    width: 120px;
    height: 100%;
    border-right: 1px solid #2a2a35;
  }
  .lane:last-child { border-right: none; }
  .hit-line {
    position: absolute;
    bottom: 80px;
    left: 0;
    width: 100%;
    height: 8px;
    background: white;
    opacity: 0.85;
    z-index: 10;
  }
  .note {
    position: absolute;
    width: 100px;
    height: 28px;
    border-radius: 6px;
    left: 10px;
  }
  #score {
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 28px;
    z-index: 20;
  }
  #combo {
    position: absolute;
    top: 55px;
    left: 20px;
    font-size: 22px;
    z-index: 20;
  }
  #judgment {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 42px;
    font-weight: bold;
    opacity: 0;
    z-index: 30;
    pointer-events: none;
  }
  .keys {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: space-around;
    font-size: 20px;
    opacity: 0.5;
  }
</style>
</head>
<body>

<div id="game">
  <div id="score">Score: 0</div>
  <div id="combo">Combo: 0</div>
  <div id="judgment"></div>
  <div class="hit-line"></div>
  <div class="keys">
    <span>D</span><span>F</span><span>J</span><span>K</span>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const judgmentEl = document.getElementById('judgment');

// Settings
const LANE_COUNT = 4;
const LANE_WIDTH = 120;
const NOTE_SPEED = 480;          // pixels per second
const SPAWN_AHEAD = 1.8;         // seconds
const HIT_Y = 560;               // hit line Y
const PERFECT = 0.07;
const GOOD = 0.14;

const keys = ['d', 'f', 'j', 'k'];
const colors = ['#33d6ff', '#ff5ab8', '#ffd633', '#5aff73'];

// Simple chart (time in seconds, lane 0-3)
const chart = [
  {t:1.0, lane:0}, {t:1.4, lane:1}, {t:1.8, lane:2}, {t:2.2, lane:3},
  {t:2.6, lane:0}, {t:2.9, lane:2}, {t:3.2, lane:1}, {t:3.6, lane:3},
  {t:4.0, lane:0}, {t:4.3, lane:1}, {t:4.6, lane:2}, {t:5.0, lane:3},
  {t:5.4, lane:0}, {t:5.7, lane:2}, {t:6.1, lane:1}, {t:6.5, lane:3},
  {t:7.0, lane:0}, {t:7.4, lane:1}, {t:7.8, lane:2}, {t:8.2, lane:3},
  {t:8.6, lane:0}, {t:9.0, lane:1}, {t:9.4, lane:2}, {t:9.8, lane:3},
];

let notes = [];
let chartIndex = 0;
let score = 0;
let combo = 0;
let startTime = null;
let pressed = [false, false, false, false];

// Create lanes
for (let i = 0; i < LANE_COUNT; i++) {
  const lane = document.createElement('div');
  lane.className = 'lane';
  lane.style.left = (i * LANE_WIDTH) + 'px';
  lane.style.background = i % 2 === 0 ? '#121218' : '#16161e';
  canvas.appendChild(lane);
}

function spawnNote(data) {
  const note = document.createElement('div');
  note.className = 'note';
  note.style.background = colors[data.lane];
  note.style.left = (data.lane * LANE_WIDTH + 10) + 'px';
  note.style.top = (HIT_Y - SPAWN_AHEAD * NOTE_SPEED) + 'px';
  canvas.appendChild(note);

  notes.push({
    el: note,
    lane: data.lane,
    time: data.t,
    y: HIT_Y - SPAWN_AHEAD * NOTE_SPEED,
    active: true
  });
}

function showJudgment(text, color) {
  judgmentEl.textContent = text;
  judgmentEl.style.color = color;
  judgmentEl.style.opacity = 1;
  setTimeout(() => {
    judgmentEl.style.transition = 'opacity 0.4s';
    judgmentEl.style.opacity = 0;
  }, 100);
}

function hitNote(n, judgment, points) {
  n.active = false;
  score += points;
  combo++;
  n.el.style.background = '#ffffff';
  n.el.style.transition = 'opacity 0.12s';
  n.el.style.opacity = 0;
  setTimeout(() => n.el.remove(), 120);

  showJudgment(judgment, judgment === 'Perfect' ? '#7aff9e' : '#ffd56a');
  updateUI();
}

function miss() {
  combo = 0;
  showJudgment('Miss', '#ff5555');
  updateUI();
}

function tryHit(lane) {
  let best = null;
  let bestDiff = 999;

  const now = (performance.now() - startTime) / 1000;

  for (const n of notes) {
    if (n.lane === lane && n.active) {
      const diff = Math.abs(now - n.time);
      if (diff < bestDiff) {
        bestDiff = diff;
        best = n;
      }
    }
  }

  if (!best) return;

  if (bestDiff <= PERFECT) {
    hitNote(best, 'Perfect', 300);
  } else if (bestDiff <= GOOD) {
    hitNote(best, 'Good', 100);
  }
}

function updateUI() {
  scoreEl.textContent = 'Score: ' + score;
  comboEl.textContent = 'Combo: ' + combo;
}

function gameLoop(timestamp) {
  if (!startTime) startTime = timestamp;
  const now = (timestamp - startTime) / 1000;

  // Spawn
  while (chartIndex < chart.length && chart[chartIndex].t - SPAWN_AHEAD <= now) {
    spawnNote(chart[chartIndex]);
    chartIndex++;
  }

  // Move notes
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i];
    n.y += NOTE_SPEED * (1/60); // approximate
    n.el.style.top = n.y + 'px';

    if (n.y > HIT_Y + 70 && n.active) {
      n.active = false;
      miss();
      n.el.remove();
      notes.splice(i, 1);
    }
  }

  requestAnimationFrame(gameLoop);
}

// Keyboard
document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  const idx = keys.indexOf(key);
  if (idx !== -1 && !pressed[idx]) {
    pressed[idx] = true;
    tryHit(idx);
  }
});

document.addEventListener('keyup', e => {
  const key = e.key.toLowerCase();
  const idx = keys.indexOf(key);
  if (idx !== -1) pressed[idx] = false;
});

// Start
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
