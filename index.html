<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rhythm Game - Actually Working</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05050a;
    color: white;
    font-family: system-ui, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  #toolbar {
    display: flex;
    gap: 10px;
    padding: 12px;
    background: #111;
    width: 100%;
    justify-content: center;
    border-bottom: 1px solid #222;
  }
  button {
    background: #1c1c24;
    color: #ddd;
    border: 1px solid #333;
    padding: 9px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #2a2a33; }
  button.active { background: #2e7d32; border-color: #4caf50; }

  #wrap {
    flex: 1;
    display: flex;
    justify-content: center;
    width: 100%;
    overflow: hidden;
  }

  #game {
    position: relative;
    width: 480px;
    height: 100%;
    background: #0b0b12;
    border-left: 2px solid #222;
    border-right: 2px solid #222;
    overflow: hidden;
  }

  .lane {
    position: absolute;
    top: 0;
    width: 120px;
    height: 100%;
    border-right: 1px solid #1a1a22;
  }

  .hit-line {
    position: absolute;
    bottom: 120px;
    left: 0;
    width: 100%;
    height: 8px;
    background: #fff;
    box-shadow: 0 0 20px #fff;
    z-index: 10;
  }

  .note {
    position: absolute;
    width: 100px;
    left: 10px;
    border-radius: 8px;
    box-shadow: 0 0 18px currentColor;
  }
  .note-head {
    height: 30px;
    border-radius: 8px;
  }
  .note-body {
    width: 60%;
    margin-left: 20%;
    opacity: 0.55;
    border-radius: 0 0 6px 6px;
  }

  #score { position: absolute; top: 20px; left: 20px; font-size: 28px; z-index: 20; }
  #combo { position: absolute; top: 55px; left: 20px; font-size: 22px; z-index: 20; }
  #judgment {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 52px;
    font-weight: bold;
    opacity: 0;
    z-index: 30;
    pointer-events: none;
    text-shadow: 0 0 25px currentColor;
  }
  .keys {
    position: absolute;
    bottom: 40px;
    width: 100%;
    display: flex;
    justify-content: space-around;
    font-size: 20px;
    opacity: 0.5;
  }

  /* Editor */
  #editor {
    display: none;
    width: 480px;
    height: 100%;
    background: #0a0a10;
    overflow-y: auto;
    border-left: 2px solid #222;
    border-right: 2px solid #222;
  }
  #editor-canvas {
    position: relative;
    width: 100%;
    height: 6000px;
    background: repeating-linear-gradient(
      to bottom,
      #0a0a10 0px,
      #0a0a10 59px,
      #12121a 59px,
      #12121a 60px
    );
  }
  .ed-lane {
    position: absolute;
    top: 0;
    width: 120px;
    height: 100%;
    border-right: 1px solid #1a1a22;
  }
  .ed-note {
    position: absolute;
    width: 100px;
    left: 10px;
    border-radius: 7px;
    cursor: pointer;
    box-shadow: 0 0 12px currentColor;
  }
  .ed-note .head { height: 26px; border-radius: 7px; }
  .ed-note .body {
    width: 55%;
    margin-left: 22.5%;
    opacity: 0.5;
    border-radius: 0 0 5px 5px;
  }
  .time {
    position: absolute;
    left: 6px;
    font-size: 12px;
    color: #555;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button id="btnPlay" class="active">▶ Play</button>
  <button id="btnEdit">✎ Editor</button>
  <button id="btnRestart">Restart</button>
  <button id="btnClear">Clear Chart</button>
  <button id="btnLong">Long: OFF</button>
</div>

<div id="wrap">
  <div id="game">
    <div id="score">Score: 0</div>
    <div id="combo">Combo: 0</div>
    <div id="judgment"></div>
    <div class="hit-line"></div>
    <div class="keys"><span>D</span><span>F</span><span>J</span><span>K</span></div>
  </div>

  <div id="editor">
    <div id="editor-canvas"></div>
  </div>
</div>

<script>
// ===================== SETTINGS =====================
const LANE_W = 120;
const SCROLL_SPEED = 320;        // pixels per second (lower = slower)
const HIT_Y = 520;
const PERFECT = 0.11;
const GOOD = 0.18;
const EDITOR_SCALE = 100;        // pixels per second in editor

const KEYS = ['d', 'f', 'j', 'k'];
const COLORS = ['#33d6ff', '#ff5ab8', '#ffd633', '#5aff73'];

// Easy starter chart
let chart = [
  {t: 1.5, lane: 0, d: 0},
  {t: 2.3, lane: 1, d: 0},
  {t: 3.1, lane: 2, d: 0},
  {t: 3.9, lane: 3, d: 0},
  {t: 4.7, lane: 0, d: 0},
  {t: 5.5, lane: 1, d: 0},
  {t: 6.3, lane: 2, d: 0},
  {t: 7.1, lane: 3, d: 0},
];

// ===================== STATE =====================
let mode = 'play';
let longMode = false;
let notes = [];
let chartIndex = 0;
let score = 0;
let combo = 0;
let startTime = 0;
let playing = false;
let pressed = [false, false, false, false];

const game = document.getElementById('game');
const editor = document.getElementById('editor');
const editorCanvas = document.getElementById('editor-canvas');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const judgmentEl = document.getElementById('judgment');

// Create play lanes
for (let i = 0; i < 4; i++) {
  const lane = document.createElement('div');
  lane.className = 'lane';
  lane.style.left = (i * LANE_W) + 'px';
  lane.style.background = i % 2 === 0 ? '#0c0c14' : '#101018';
  game.appendChild(lane);
}

// Create editor lanes + time markers
for (let i = 0; i < 4; i++) {
  const lane = document.createElement('div');
  lane.className = 'ed-lane';
  lane.style.left = (i * LANE_W) + 'px';
  editorCanvas.appendChild(lane);
}
for (let t = 0; t <= 60; t++) {
  const label = document.createElement('div');
  label.className = 'time';
  label.style.top = (t * EDITOR_SCALE) + 'px';
  label.textContent = t + 's';
  editorCanvas.appendChild(label);
}

// ===================== HELPERS =====================
function showJudgment(text, color) {
  judgmentEl.textContent = text;
  judgmentEl.style.color = color;
  judgmentEl.style.opacity = '1';
  judgmentEl.style.transform = 'translateX(-50%) scale(1.3)';
  setTimeout(() => {
    judgmentEl.style.transition = 'all 0.3s';
    judgmentEl.style.opacity = '0';
    judgmentEl.style.transform = 'translateX(-50%) scale(0.8)';
  }, 50);
}

function updateUI() {
  scoreEl.textContent = 'Score: ' + score;
  comboEl.textContent = 'Combo: ' + combo;
}

// ===================== PLAY LOGIC =====================
function spawnNote(data) {
  const el = document.createElement('div');
  el.className = 'note';
  el.style.color = COLORS[data.lane];
  el.style.left = (data.lane * LANE_W + 10) + 'px';

  const head = document.createElement('div');
  head.className = 'note-head';
  head.style.background = COLORS[data.lane];
  el.appendChild(head);

  if (data.d > 0) {
    const body = document.createElement('div');
    body.className = 'note-body';
    body.style.height = (data.d * SCROLL_SPEED) + 'px';
    body.style.background = COLORS[data.lane];
    el.appendChild(body);
  }

  game.appendChild(el);

  notes.push({
    el: el,
    lane: data.lane,
    time: data.t,
    duration: data.d || 0,
    active: true
  });
}

function tryHit(lane) {
  if (!playing || mode !== 'play') return;

  const now = (performance.now() - startTime) / 1000;
  let best = null;
  let bestDiff = 999;

  for (const n of notes) {
    if (n.lane === lane && n.active) {
      const diff = Math.abs(now - n.time);
      if (diff < bestDiff) {
        bestDiff = diff;
        best = n;
      }
    }
  }

  if (!best) return;

  if (bestDiff <= PERFECT) {
    hit(best, 'Perfect', 300);
  } else if (bestDiff <= GOOD) {
    hit(best, 'Good', 100);
  }
}

function hit(n, judgment, points) {
  n.active = false;
  score += points;
  combo++;
  showJudgment(judgment, judgment === 'Perfect' ? '#7aff9e' : '#ffd56a');

  n.el.style.transition = 'opacity 0.1s, transform 0.1s';
  n.el.style.opacity = '0';
  n.el.style.transform = 'scale(1.4)';
  setTimeout(() => n.el.remove(), 100);

  updateUI();
}

function miss(n) {
  n.active = false;
  combo = 0;
  showJudgment('Miss', '#ff5555');
  n.el.remove();
  updateUI();
}

// Main loop - this is the important part
function loop(timestamp) {
  if (!startTime) startTime = timestamp;
  const now = (timestamp - startTime) / 1000;

  if (playing && mode === 'play') {
    // Spawn notes early enough
    while (chartIndex < chart.length && chart[chartIndex].t - 2.2 <= now) {
      spawnNote(chart[chartIndex]);
      chartIndex++;
    }

    // Move notes using pure time math (this makes them land correctly)
    for (let i = notes.length - 1; i >= 0; i--) {
      const n = notes[i];
      const timeLeft = n.time - now;
      const y = HIT_Y - (timeLeft * SCROLL_SPEED);

      n.el.style.top = y + 'px';

      // Too late → miss
      if (now > n.time + GOOD + 0.05 && n.active) {
        miss(n);
        notes.splice(i, 1);
      }
    }
  }

  requestAnimationFrame(loop);
}

// Keyboard
document.addEventListener('keydown', e => {
  const idx = KEYS.indexOf(e.key.toLowerCase());
  if (idx === -1) return;
  if (!pressed[idx]) {
    pressed[idx] = true;
    tryHit(idx);
  }
});
document.addEventListener('keyup', e => {
  const idx = KEYS.indexOf(e.key.toLowerCase());
  if (idx !== -1) pressed[idx] = false;
});

// ===================== EDITOR =====================
function renderEditor() {
  editorCanvas.querySelectorAll('.ed-note').forEach(n => n.remove());

  chart.forEach((data, i) => {
    const el = document.createElement('div');
    el.className = 'ed-note';
    el.style.color = COLORS[data.lane];
    el.style.left = (data.lane * LANE_W + 10) + 'px';
    el.style.top = (data.t * EDITOR_SCALE) + 'px';

    const head = document.createElement('div');
    head.className = 'head';
    head.style.background = COLORS[data.lane];
    el.appendChild(head);

    if (data.d > 0) {
      const body = document.createElement('div');
      body.className = 'body';
      body.style.height = (data.d * EDITOR_SCALE) + 'px';
      body.style.background = COLORS[data.lane];
      el.appendChild(body);
    }

    el.oncontextmenu = e => {
      e.preventDefault();
      chart.splice(i, 1);
      renderEditor();
    };

    editorCanvas.appendChild(el);
  });
}

let dragStart = null;

editorCanvas.addEventListener('mousedown', e => {
  if (mode !== 'edit') return;
  const rect = editorCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top + editor.scrollTop;
  const lane = Math.floor(x / LANE_W);
  if (lane < 0 || lane > 3) return;

  const t = y / EDITOR_SCALE;

  if (e.button === 0) {
    if (longMode || e.shiftKey) {
      dragStart = { t, lane };
    } else {
      chart.push({ t: Math.max(0.5, t), lane, d: 0 });
      chart.sort((a, b) => a.t - b.t);
      renderEditor();
    }
  }
});

editorCanvas.addEventListener('mouseup', e => {
  if (!dragStart) return;
  const rect = editorCanvas.getBoundingClientRect();
  const y = e.clientY - rect.top + editor.scrollTop;
  const endT = y / EDITOR_SCALE;
  const duration = Math.max(0.25, endT - dragStart.t);

  chart.push({ t: dragStart.t, lane: dragStart.lane, d: duration });
  chart.sort((a, b) => a.t - b.t);
  dragStart = null;
  renderEditor();
});

// ===================== BUTTONS =====================
function startPlay() {
  mode = 'play';
  document.getElementById('btnPlay').classList.add('active');
  document.getElementById('btnEdit').classList.remove('active');
  game.style.display = 'block';
  editor.style.display = 'none';

  // Full reset
  notes.forEach(n => n.el.remove());
  notes = [];
  chartIndex = 0;
  score = 0;
  combo = 0;
  startTime = 0;
  playing = true;
  updateUI();
}

document.getElementById('btnPlay').onclick = startPlay;

document.getElementById('btnEdit').onclick = () => {
  mode = 'edit';
  playing = false;
  document.getElementById('btnEdit').classList.add('active');
  document.getElementById('btnPlay').classList.remove('active');
  game.style.display = 'none';
  editor.style.display = 'block';
  renderEditor();
};

document.getElementById('btnRestart').onclick = startPlay;

document.getElementById('btnClear').onclick = () => {
  chart = [];
  renderEditor();
};

document.getElementById('btnLong').onclick = function () {
  longMode = !longMode;
  this.textContent = 'Long: ' + (longMode ? 'ON' : 'OFF');
  this.classList.toggle('active', longMode);
};

// Start the game
startPlay();
requestAnimationFrame(loop);
</script>
</body>
</html>
