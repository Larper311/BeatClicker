<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Neon Dash — Geometry Dash Style</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;600;800&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #03030c;
    overflow: hidden;
    font-family: 'Exo 2', system-ui, sans-serif;
    color: #fff;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
    user-select: none;
  }

  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1280px;
    max-height: 720px;
    box-shadow: 0 0 80px rgba(0, 255, 200, 0.12);
    border-radius: 10px;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #060612;
  }

  #ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 14px 18px;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-shadow: 0 0 12px rgba(0, 255, 200, 0.5);
  }

  .progress-container {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 42%;
    max-width: 340px;
    height: 7px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid rgba(0,255,200,0.15);
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00ffc8, #00b4ff);
    border-radius: 4px;
    box-shadow: 0 0 14px #00ffc8;
    transition: width 0.08s linear;
  }

  .attempts { opacity: 0.9; }

  .center-message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 8vw, 4.8rem);
    background: linear-gradient(135deg, #00ffc8 0%, #00b4ff 50%, #ff00aa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 28px rgba(0, 255, 200, 0.45));
    margin-bottom: 6px;
    letter-spacing: 3px;
  }

  .subtitle {
    font-size: 1rem;
    opacity: 0.75;
    margin-bottom: 30px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .big-btn {
    pointer-events: auto;
    background: linear-gradient(135deg, #00ffc8, #00c4a0);
    color: #03030c;
    border: none;
    padding: 15px 48px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 1.5px;
    box-shadow: 0 0 35px rgba(0, 255, 200, 0.55);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .big-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 0 50px rgba(0, 255, 200, 0.75);
  }

  .big-btn:active { transform: scale(0.96); }

  .hint {
    margin-top: 24px;
    font-size: 0.9rem;
    opacity: 0.55;
  }

  .death-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.9rem;
    font-weight: 900;
    color: #ff2d6a;
    text-shadow: 0 0 35px rgba(255, 45, 106, 0.75);
    margin-bottom: 10px;
  }

  .win-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.7rem;
    font-weight: 900;
    color: #00ffc8;
    text-shadow: 0 0 35px rgba(0, 255, 200, 0.75);
    margin-bottom: 10px;
  }

  .small {
    font-size: 1.05rem;
    opacity: 0.85;
    margin-bottom: 22px;
  }

  #overlay, #deathOverlay, #winOverlay {
    position: absolute;
    inset: 0;
    background: rgba(3, 3, 12, 0.78);
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    backdrop-filter: blur(4px);
  }

  .hidden { display: none !important; }

  .controls-info {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.82rem;
    opacity: 0.5;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
      <div class="top-bar">
        <div class="attempts">ATTEMPT <span id="attemptCount">1</span></div>
        <div></div>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div id="overlay">
      <div class="center-message">
        <div class="title">NEON DASH</div>
        <div class="subtitle">Geometry Dash Style</div>
        <button class="big-btn" id="startBtn">PLAY</button>
        <div class="hint">Click / Space / Tap to Jump</div>
        <div class="controls-info">Best Progress: <span id="bestProgress">0</span>%</div>
      </div>
    </div>

    <div id="deathOverlay" class="hidden">
      <div class="center-message">
        <div class="death-text">CRASHED</div>
        <div class="small">Progress: <span id="deathProgress">0</span>%</div>
        <button class="big-btn" id="retryBtn">RETRY</button>
      </div>
    </div>

    <div id="winOverlay" class="hidden">
      <div class="center-message">
        <div class="win-text">LEVEL COMPLETE!</div>
        <div class="small">Attempts: <span id="winAttempts">1</span></div>
        <button class="big-btn" id="againBtn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // ====================== TUNED PHYSICS ======================
  // Jump height ~155px, airtime ~0.68s, horizontal coverage ~310px
  // This makes single spikes easy, double spikes skillful, triples precise but possible
  const CONFIG = {
    WIDTH: 960,
    HEIGHT: 540,
    GROUND_Y: 430,
    PLAYER_SIZE: 34,
    RUN_SPEED: 455,
    GRAVITY: 2650,
    JUMP_FORCE: -980,
    ROTATION_SPEED: 11.5,
    CAMERA_OFFSET_X: 240,
    COYOTE_TIME: 0.09,
    JUMP_BUFFER: 0.14,
  };

  let state = 'menu';
  let lastTime = 0;
  let attempt = 1;
  let bestProgress = parseFloat(localStorage.getItem('neonDashBest') || '0');
  let progress = 0;
  let shake = 0;
  let gravityDir = 1;
  let cameraX = 0;
  let cameraY = 0;
  let coyote = 0;
  let jumpBuffer = 0;
  let audioCtx = null;

  const player = {
    x: 0,
    y: 0,
    vy: 0,
    rotation: 0,
    onGround: true,
    dead: false,
    trail: [],
  };

  // ====================== FAIR + CHALLENGING LEVEL ======================
  // Spacing designed around jump distance of ~280-320px
  // Single spikes: easy warm-up
  // Double spikes: requires clean timing
  // Platforms: generous landing windows
  // Gravity section: clear and readable
  const level = [
    // ===== INTRO (easy) =====
    { type: 'spike', x: 580, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'spike', x: 880, y: CONFIG.GROUND_Y, w: 28, h: 28 },

    // Double spike (learn the jump)
    { type: 'spike', x: 1180, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'spike', x: 1215, y: CONFIG.GROUND_Y, w: 28, h: 28 },

    // Raised block + landing
    { type: 'block', x: 1500, y: CONFIG.GROUND_Y - 48, w: 56, h: 48 },
    { type: 'spike', x: 1680, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'spike', x: 1715, y: CONFIG.GROUND_Y, w: 28, h: 28 },

    // ===== PLATFORM SECTION =====
    { type: 'platform', x: 1950, y: CONFIG.GROUND_Y - 85, w: 130, h: 18 },
    { type: 'spike', x: 2150, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'platform', x: 2320, y: CONFIG.GROUND_Y - 130, w: 110, h: 18 },
    { type: 'spike', x: 2500, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'spike', x: 2535, y: CONFIG.GROUND_Y, w: 28, h: 28 },

    // Triple spike (precise but fair)
    { type: 'block', x: 2800, y: CONFIG.GROUND_Y - 55, w: 52, h: 55 },
    { type: 'spike', x: 2980, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'spike', x: 3015, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'spike', x: 3050, y: CONFIG.GROUND_Y, w: 28, h: 28 },

    // Floating steps
    { type: 'platform', x: 3280, y: CONFIG.GROUND_Y - 75, w: 100, h: 16 },
    { type: 'platform', x: 3480, y: CONFIG.GROUND_Y - 120, w: 100, h: 16 },
    { type: 'platform', x: 3680, y: CONFIG.GROUND_Y - 80, w: 100, h: 16 },
    { type: 'spike', x: 3860, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'spike', x: 3895, y: CONFIG.GROUND_Y, w: 28, h: 28 },

    // ===== GRAVITY FLIP SECTION =====
    { type: 'portal', x: 4150, y: CONFIG.GROUND_Y - 130, w: 36, h: 130, flip: true },

    // Upside-down spikes (ceiling)
    { type: 'spike', x: 4400, y: 55, w: 28, h: 28, upsideDown: true },
    { type: 'spike', x: 4435, y: 55, w: 28, h: 28, upsideDown: true },
    { type: 'platform', x: 4600, y: 145, w: 140, h: 16 },
    { type: 'spike', x: 4820, y: 55, w: 28, h: 28, upsideDown: true },
    { type: 'spike', x: 4855, y: 55, w: 28, h: 28, upsideDown: true },

    // Return portal
    { type: 'portal', x: 5050, y: 55, w: 36, h: 130, flip: true },

    // ===== FINAL RUN =====
    { type: 'spike', x: 5300, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'spike', x: 5335, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'block', x: 5550, y: CONFIG.GROUND_Y - 50, w: 50, h: 50 },
    { type: 'spike', x: 5720, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'spike', x: 5755, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'spike', x: 5790, y: CONFIG.GROUND_Y, w: 28, h: 28 },

    { type: 'platform', x: 6000, y: CONFIG.GROUND_Y - 95, w: 120, h: 16 },
    { type: 'spike', x: 6200, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'spike', x: 6235, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'spike', x: 6270, y: CONFIG.GROUND_Y, w: 28, h: 28 },
    { type: 'spike', x: 6305, y: CONFIG.GROUND_Y, w: 28, h: 28 },

    // Finish
    { type: 'finish', x: 6600, y: CONFIG.GROUND_Y - 200, w: 48, h: 200 },
  ];

  const LEVEL_END = 6750;

  let particles = [];

  function spawnParticles(x, y, color, count = 14, speed = 200) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const sp = speed * (0.35 + Math.random() * 0.9);
      particles.push({
        x, y,
        vx: Math.cos(angle) * sp,
        vy: Math.sin(angle) * sp - 40,
        life: 0.45 + Math.random() * 0.4,
        maxLife: 0.45 + Math.random() * 0.4,
        size: 2.2 + Math.random() * 3.8,
        color,
      });
    }
  }

  // ====================== AUDIO ======================
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playTone(freq, duration, type = 'square', volume = 0.07) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function playJump() {
    playTone(480, 0.07, 'square', 0.06);
    setTimeout(() => playTone(720, 0.05, 'square', 0.04), 35);
  }

  function playDeath() {
    playTone(160, 0.22, 'sawtooth', 0.09);
    setTimeout(() => playTone(80, 0.28, 'sawtooth', 0.07), 70);
  }

  function playPortal() {
    playTone(280, 0.09, 'sine', 0.07);
    setTimeout(() => playTone(460, 0.1, 'sine', 0.06), 55);
    setTimeout(() => playTone(680, 0.14, 'sine', 0.05), 110);
  }

  function playWin() {
    [523, 659, 784, 1047].forEach((f, i) => {
      setTimeout(() => playTone(f, 0.18, 'square', 0.06), i * 110);
    });
  }

  // ====================== INPUT ======================
  let jumpQueued = false;

  function queueJump() {
    if (state === 'playing' && !player.dead) {
      jumpQueued = true;
      jumpBuffer = CONFIG.JUMP_BUFFER;
    }
  }

  window.addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
      e.preventDefault();
      if (state === 'menu') startGame();
      else if (state === 'dead' || state === 'win') restart();
      else queueJump();
    }
    if (e.code === 'KeyR' && (state === 'playing' || state === 'dead')) restart();
  });

  canvas.addEventListener('mousedown', e => {
    e.preventDefault();
    if (state === 'menu') startGame();
    else if (state === 'dead' || state === 'win') restart();
    else queueJump();
  });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (state === 'menu') startGame();
    else if (state === 'dead' || state === 'win') restart();
    else queueJump();
  }, { passive: false });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', restart);
  document.getElementById('againBtn').addEventListener('click', restart);

  // ====================== CORE ======================
  function resetPlayer() {
    player.x = 80;
    player.y = CONFIG.GROUND_Y - CONFIG.PLAYER_SIZE;
    player.vy = 0;
    player.rotation = 0;
    player.onGround = true;
    player.dead = false;
    player.trail = [];
    gravityDir = 1;
    cameraX = 0;
    cameraY = 0;
    progress = 0;
    particles = [];
    shake = 0;
    coyote = 0;
    jumpBuffer = 0;
    jumpQueued = false;
    for (const obj of level) {
      if (obj.type === 'portal') obj.used = false;
    }
  }

  function startGame() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    state = 'playing';
    attempt = 1;
    document.getElementById('attemptCount').textContent = attempt;
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('deathOverlay').classList.add('hidden');
    document.getElementById('winOverlay').classList.add('hidden');
    resetPlayer();
  }

  function restart() {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    state = 'playing';
    attempt++;
    document.getElementById('attemptCount').textContent = attempt;
    document.getElementById('deathOverlay').classList.add('hidden');
    document.getElementById('winOverlay').classList.add('hidden');
    resetPlayer();
  }

  function die() {
    if (player.dead) return;
    player.dead = true;
    state = 'dead';
    playDeath();
    shake = 16;
    const cx = player.x + CONFIG.PLAYER_SIZE / 2;
    const cy = player.y + CONFIG.PLAYER_SIZE / 2;
    spawnParticles(cx, cy, '#ff2d6a', 32, 340);
    spawnParticles(cx, cy, '#ffffff', 14, 220);

    const pct = Math.floor(progress * 100);
    document.getElementById('deathProgress').textContent = pct;
    if (pct > bestProgress) {
      bestProgress = pct;
      localStorage.setItem('neonDashBest', String(bestProgress));
      document.getElementById('bestProgress').textContent = Math.floor(bestProgress);
    }

    setTimeout(() => {
      if (state === 'dead') document.getElementById('deathOverlay').classList.remove('hidden');
    }, 550);
  }

  function win() {
    state = 'win';
    playWin();
    spawnParticles(player.x + CONFIG.PLAYER_SIZE / 2, player.y + CONFIG.PLAYER_SIZE / 2, '#00ffc8', 45, 300);
    document.getElementById('winAttempts').textContent = attempt;
    bestProgress = 100;
    localStorage.setItem('neonDashBest', '100');
    document.getElementById('bestProgress').textContent = '100';
    setTimeout(() => document.getElementById('winOverlay').classList.remove('hidden'), 380);
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function getPlayerHitbox() {
    // Forgiving hitbox (classic Geometry Dash feel)
    const inset = 5;
    return {
      x: player.x + inset,
      y: player.y + inset,
      w: CONFIG.PLAYER_SIZE - inset * 2,
      h: CONFIG.PLAYER_SIZE - inset * 2,
    };
  }

  function update(dt) {
    // Always update particles & shake
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 520 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    if (shake > 0) {
      shake *= Math.pow(0.87, dt * 60);
      if (shake < 0.35) shake = 0;
    }

    if (state !== 'playing' || player.dead) return;

    // Timers
    if (jumpBuffer > 0) jumpBuffer -= dt;
    if (coyote > 0) coyote -= dt;

    // Constant run
    player.x += CONFIG.RUN_SPEED * dt;

    // Jump (with coyote + buffer)
    const canJump = player.onGround || coyote > 0;
    if ((jumpQueued || jumpBuffer > 0) && canJump) {
      player.vy = CONFIG.JUMP_FORCE * gravityDir;
      player.onGround = false;
      coyote = 0;
      jumpBuffer = 0;
      jumpQueued = false;
      playJump();
      const landY = gravityDir === 1 ? player.y + CONFIG.PLAYER_SIZE : player.y;
      spawnParticles(player.x + CONFIG.PLAYER_SIZE / 2, landY, '#00ffc8', 9, 130);
    }
    jumpQueued = false;

    // Gravity
    player.vy += CONFIG.GRAVITY * gravityDir * dt;
    // Terminal velocity
    const maxFall = 1400;
    if (gravityDir === 1 && player.vy > maxFall) player.vy = maxFall;
    if (gravityDir === -1 && player.vy < -maxFall) player.vy = -maxFall;

    player.y += player.vy * dt;

    // Rotation
    if (!player.onGround) {
      player.rotation += CONFIG.ROTATION_SPEED * gravityDir * dt;
    } else {
      const snapped = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
      player.rotation += (snapped - player.rotation) * Math.min(1, 18 * dt);
    }

    // Ground / ceiling
    const groundY = CONFIG.GROUND_Y - CONFIG.PLAYER_SIZE;
    const ceilingY = 48;

    if (gravityDir === 1) {
      if (player.y >= groundY) {
        player.y = groundY;
        player.vy = 0;
        if (!player.onGround) coyote = CONFIG.COYOTE_TIME;
        player.onGround = true;
      } else {
        player.onGround = false;
      }
      if (player.y < ceilingY) {
        player.y = ceilingY;
        player.vy = 0;
      }
    } else {
      if (player.y <= ceilingY) {
        player.y = ceilingY;
        player.vy = 0;
        if (!player.onGround) coyote = CONFIG.COYOTE_TIME;
        player.onGround = true;
      } else {
        player.onGround = false;
      }
      if (player.y > groundY) {
        player.y = groundY;
        player.vy = 0;
      }
    }

    // Object collisions
    const pRect = getPlayerHitbox();

    for (const obj of level) {
      if (obj.type === 'platform' || obj.type === 'block') {
        const o = { x: obj.x, y: obj.y, w: obj.w, h: obj.h };
        if (rectsOverlap(pRect, o)) {
          if (gravityDir === 1) {
            // Land on top
            if (player.vy >= 0 && (player.y + CONFIG.PLAYER_SIZE - player.vy * dt) <= obj.y + 12) {
              player.y = obj.y - CONFIG.PLAYER_SIZE;
              player.vy = 0;
              player.onGround = true;
              coyote = CONFIG.COYOTE_TIME;
            }
            // Hit underside
            else if (player.vy < 0 && player.y - player.vy * dt >= obj.y + obj.h - 10) {
              player.y = obj.y + obj.h;
              player.vy = 0;
            }
            // Side hit → death
            else {
              die();
              return;
            }
          } else {
            // Upside-down
            if (player.vy <= 0 && (player.y - player.vy * dt) >= obj.y + obj.h - 12) {
              player.y = obj.y + obj.h;
              player.vy = 0;
              player.onGround = true;
              coyote = CONFIG.COYOTE_TIME;
            } else if (player.vy > 0 && player.y + CONFIG.PLAYER_SIZE - player.vy * dt <= obj.y + 10) {
              player.y = obj.y - CONFIG.PLAYER_SIZE;
              player.vy = 0;
            } else {
              die();
              return;
            }
          }
        }
      }

      if (obj.type === 'spike') {
        const hit = {
          x: obj.x + 5,
          y: obj.upsideDown ? obj.y : obj.y - obj.h + 7,
          w: obj.w - 10,
          h: obj.h - 8,
        };
        if (rectsOverlap(pRect, hit)) {
          die();
          return;
        }
      }

      if (obj.type === 'portal') {
        const pr = { x: obj.x, y: obj.y, w: obj.w, h: obj.h };
        if (rectsOverlap(pRect, pr) && !obj.used) {
          obj.used = true;
          gravityDir *= -1;
          player.vy *= 0.25;
          player.onGround = false;
          coyote = 0;
          playPortal();
          spawnParticles(obj.x + obj.w / 2, obj.y + obj.h / 2, '#ff00aa', 22, 240);
        }
      }

      if (obj.type === 'finish' && player.x + CONFIG.PLAYER_SIZE > obj.x) {
        win();
        return;
      }
    }

    // Trail
    player.trail.push({
      x: player.x + CONFIG.PLAYER_SIZE / 2,
      y: player.y + CONFIG.PLAYER_SIZE / 2,
      life: 0.32,
    });
    if (player.trail.length > 16) player.trail.shift();
    for (const t of player.trail) t.life -= dt;

    // Progress + smooth camera
    progress = Math.min(1, player.x / LEVEL_END);
    document.getElementById('progressBar').style.width = (progress * 100) + '%';

    const targetCamX = player.x - CONFIG.CAMERA_OFFSET_X;
    cameraX += (targetCamX - cameraX) * Math.min(1, 8 * dt);

    // Slight vertical camera follow when high
    const targetCamY = Math.max(0, (CONFIG.GROUND_Y - 280) - player.y) * 0.25;
    cameraY += (targetCamY - cameraY) * Math.min(1, 5 * dt);
  }

  // ====================== RENDER ======================
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, CONFIG.HEIGHT);
    g.addColorStop(0, '#05051a');
    g.addColorStop(0.55, '#09091f');
    g.addColorStop(1, '#04040e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

    // Parallax dots
    ctx.save();
    ctx.globalAlpha = 0.3;
    for (let i = 0; i < 55; i++) {
      const sx = ((i * 89 - cameraX * 0.25) % (CONFIG.WIDTH + 120)) - 60;
      const sy = (i * 47 + 30) % CONFIG.HEIGHT;
      ctx.fillStyle = i % 5 === 0 ? '#00ffc8' : '#aaccff';
      ctx.beginPath();
      ctx.arc(sx, sy, i % 4 === 0 ? 1.6 : 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Speed lines
    ctx.save();
    ctx.globalAlpha = 0.05;
    ctx.strokeStyle = '#00ffc8';
    ctx.lineWidth = 1;
    const grid = 70;
    const off = -(cameraX * 0.45) % grid;
    for (let x = off; x < CONFIG.WIDTH + grid; x += grid) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, CONFIG.HEIGHT);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGround() {
    ctx.fillStyle = '#0d0d22';
    ctx.fillRect(0, CONFIG.GROUND_Y - cameraY, CONFIG.WIDTH, CONFIG.HEIGHT - CONFIG.GROUND_Y + 40);

    // Neon ground
    ctx.strokeStyle = '#00ffc8';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00ffc8';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(0, CONFIG.GROUND_Y - cameraY);
    ctx.lineTo(CONFIG.WIDTH, CONFIG.GROUND_Y - cameraY);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Ceiling
    ctx.strokeStyle = 'rgba(255, 0, 170, 0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 48 - cameraY);
    ctx.lineTo(CONFIG.WIDTH, 48 - cameraY);
    ctx.stroke();
  }

  function drawPlayer() {
    const px = player.x - cameraX;
    const py = player.y - cameraY;

    // Trail
    for (const t of player.trail) {
      if (t.life <= 0) continue;
      const a = t.life / 0.32;
      ctx.globalAlpha = a * 0.45;
      ctx.fillStyle = '#00ffc8';
      ctx.beginPath();
      ctx.arc(t.x - cameraX, t.y - cameraY, 3.5 * a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(px + CONFIG.PLAYER_SIZE / 2, py + CONFIG.PLAYER_SIZE / 2);
    ctx.rotate(player.rotation);

    // Outer glow
    ctx.shadowColor = '#00ffc8';
    ctx.shadowBlur = 20;

    const half = CONFIG.PLAYER_SIZE / 2;
    // Main body
    ctx.fillStyle = '#00ffc8';
    ctx.fillRect(-half, -half, CONFIG.PLAYER_SIZE, CONFIG.PLAYER_SIZE);

    ctx.shadowBlur = 0;
    // Inner
    ctx.fillStyle = '#070714';
    ctx.fillRect(-half + 5, -half + 5, CONFIG.PLAYER_SIZE - 10, CONFIG.PLAYER_SIZE - 10);

    // Face
    ctx.fillStyle = '#00ffc8';
    ctx.fillRect(-5, -7, 10, 5);
    ctx.fillRect(-7, 1, 5, 5);
    ctx.fillRect(2, 1, 5, 5);

    ctx.restore();
  }

  function drawObject(obj) {
    const ox = obj.x - cameraX;
    const oy = obj.y - cameraY;
    if (ox + (obj.w || 40) < -60 || ox > CONFIG.WIDTH + 60) return;

    if (obj.type === 'spike') {
      ctx.save();
      ctx.shadowColor = '#ff2d6a';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ff2d6a';
      ctx.beginPath();
      if (obj.upsideDown) {
        ctx.moveTo(ox, oy + obj.h);
        ctx.lineTo(ox + obj.w / 2, oy);
        ctx.lineTo(ox + obj.w, oy + obj.h);
      } else {
        ctx.moveTo(ox, oy);
        ctx.lineTo(ox + obj.w / 2, oy - obj.h);
        ctx.lineTo(ox + obj.w, oy);
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
    else if (obj.type === 'block' || obj.type === 'platform') {
      ctx.save();
      const col = obj.type === 'platform' ? '#00b4ff' : '#00ffc8';
      ctx.shadowColor = col;
      ctx.shadowBlur = 10;
      ctx.fillStyle = col;
      ctx.fillRect(ox, oy, obj.w, obj.h);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#070714';
      ctx.fillRect(ox + 4, oy + 4, obj.w - 8, obj.h - 8);
      ctx.restore();
    }
    else if (obj.type === 'portal') {
      const grad = ctx.createLinearGradient(ox, oy, ox + obj.w, oy);
      grad.addColorStop(0, 'rgba(255,0,170,0)');
      grad.addColorStop(0.5, '#ff00aa');
      grad.addColorStop(1, 'rgba(255,0,170,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(ox, oy, obj.w, obj.h);

      ctx.strokeStyle = '#ff00aa';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#ff00aa';
      ctx.shadowBlur = 18;
      ctx.strokeRect(ox + 5, oy + 12, obj.w - 10, obj.h - 24);
      ctx.shadowBlur = 0;
    }
    else if (obj.type === 'finish') {
      ctx.save();
      ctx.shadowColor = '#00ffc8';
      ctx.shadowBlur = 22;
      const grad = ctx.createLinearGradient(ox, oy, ox, oy + obj.h);
      grad.addColorStop(0, 'rgba(0,255,200,0.85)');
      grad.addColorStop(1, 'rgba(0,255,200,0.08)');
      ctx.fillStyle = grad;
      ctx.fillRect(ox, oy, obj.w, obj.h);

      // Checkered
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      for (let i = 0; i < 7; i++) {
        for (let j = 0; j < 2; j++) {
          if ((i + j) % 2 === 0) {
            ctx.fillRect(ox + j * 24, oy + i * 28, 24, 28);
          }
        }
      }
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x - cameraX, p.y - cameraY, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawBackground();
    drawGround();

    for (const obj of level) drawObject(obj);

    if (!player.dead || state === 'playing') drawPlayer();

    drawParticles();
    ctx.restore();
  }

  // ====================== LOOP ======================
  function resize() {
    canvas.width = CONFIG.WIDTH;
    canvas.height = CONFIG.HEIGHT;
  }
  window.addEventListener('resize', resize);
  resize();

  document.getElementById('bestProgress').textContent = Math.floor(bestProgress);

  function loop(ts) {
    if (!lastTime) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    lastTime = ts;
    dt = Math.min(dt, 0.033);

    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
