<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Dash — Geometry Dash Style</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;600;800&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #050510;
    overflow: hidden;
    font-family: 'Exo 2', system-ui, sans-serif;
    color: #fff;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
  }

  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1280px;
    max-height: 720px;
    box-shadow: 0 0 60px rgba(0, 255, 200, 0.15);
    border-radius: 8px;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #0a0a18;
  }

  #ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 20px;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(0, 255, 200, 0.6);
  }

  .progress-container {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 40%;
    max-width: 320px;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00ffc8, #00aaff);
    border-radius: 4px;
    transition: width 0.1s linear;
    box-shadow: 0 0 12px #00ffc8;
  }

  .attempts {
    opacity: 0.85;
  }

  .center-message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(2.2rem, 8vw, 4.5rem);
    background: linear-gradient(135deg, #00ffc8, #00aaff, #ff00aa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 40px rgba(0, 255, 200, 0.4);
    margin-bottom: 8px;
    letter-spacing: 2px;
  }

  .subtitle {
    font-size: 1.1rem;
    opacity: 0.8;
    margin-bottom: 28px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .big-btn {
    pointer-events: auto;
    background: linear-gradient(135deg, #00ffc8, #00ccaa);
    color: #050510;
    border: none;
    padding: 14px 42px;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 0 30px rgba(0, 255, 200, 0.5);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .big-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 45px rgba(0, 255, 200, 0.7);
  }

  .big-btn:active {
    transform: scale(0.97);
  }

  .hint {
    margin-top: 22px;
    font-size: 0.9rem;
    opacity: 0.6;
  }

  .death-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #ff3366;
    text-shadow: 0 0 30px rgba(255, 50, 100, 0.7);
    margin-bottom: 12px;
  }

  .win-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    color: #00ffc8;
    text-shadow: 0 0 30px rgba(0, 255, 200, 0.7);
    margin-bottom: 12px;
  }

  .small {
    font-size: 1rem;
    opacity: 0.85;
    margin-bottom: 20px;
  }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 5, 16, 0.75);
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
  }

  .hidden {
    display: none !important;
  }

  .controls-info {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.8rem;
    opacity: 0.5;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="ui">
      <div class="top-bar">
        <div class="attempts">ATTEMPT <span id="attemptCount">1</span></div>
        <div></div>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <!-- Start Overlay -->
    <div id="overlay" class="start-overlay">
      <div class="center-message">
        <div class="title">NEON DASH</div>
        <div class="subtitle">Geometry Dash Style</div>
        <button class="big-btn" id="startBtn">PLAY</button>
        <div class="hint">Click / Space / Tap to Jump</div>
        <div class="controls-info">Best Progress: <span id="bestProgress">0</span>%</div>
      </div>
    </div>

    <!-- Death Overlay -->
    <div id="deathOverlay" class="hidden">
      <div class="center-message">
        <div class="death-text">CRASHED</div>
        <div class="small">Progress: <span id="deathProgress">0</span>%</div>
        <button class="big-btn" id="retryBtn">RETRY</button>
      </div>
    </div>

    <!-- Win Overlay -->
    <div id="winOverlay" class="hidden">
      <div class="center-message">
        <div class="win-text">LEVEL COMPLETE!</div>
        <div class="small">Attempts: <span id="winAttempts">1</span></div>
        <button class="big-btn" id="againBtn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

<script>
(() => {
  // ====================== CONFIG ======================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const CONFIG = {
    WIDTH: 960,
    HEIGHT: 540,
    GROUND_Y: 420,
    PLAYER_SIZE: 36,
    RUN_SPEED: 420,           // pixels per second
    GRAVITY: 2800,
    JUMP_FORCE: -920,
    ROTATION_SPEED: 10,       // rad/s while airborne
    CAMERA_OFFSET_X: 220,
    PARTICLE_COUNT: 18,
  };

  // ====================== STATE ======================
  let state = 'menu'; // menu | playing | dead | win
  let lastTime = 0;
  let attempt = 1;
  let bestProgress = parseFloat(localStorage.getItem('neonDashBest') || '0');
  let progress = 0;
  let shake = 0;
  let shakeDecay = 0;

  // Audio context (lazy)
  let audioCtx = null;

  // ====================== PLAYER ======================
  const player = {
    x: 0,
    y: CONFIG.GROUND_Y - CONFIG.PLAYER_SIZE,
    vy: 0,
    rotation: 0,
    onGround: true,
    dead: false,
    trail: [],
  };

  // ====================== LEVEL DATA ======================
  // Hand-crafted Geometry Dash style level (x positions in world units)
  // Types: ground, spike, block, platform, portal (gravity flip), finish
  const level = [
    // Intro section
    { type: 'spike', x: 650, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 900, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 930, y: CONFIG.GROUND_Y, w: 30, h: 30 },

    // First jump over double spike
    { type: 'block', x: 1200, y: CONFIG.GROUND_Y - 40, w: 50, h: 40 },
    { type: 'spike', x: 1350, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 1380, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 1410, y: CONFIG.GROUND_Y, w: 30, h: 30 },

    // Platform section
    { type: 'platform', x: 1600, y: CONFIG.GROUND_Y - 90, w: 120, h: 20 },
    { type: 'spike', x: 1750, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'platform', x: 1850, y: CONFIG.GROUND_Y - 140, w: 100, h: 20 },
    { type: 'spike', x: 1980, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 2010, y: CONFIG.GROUND_Y, w: 30, h: 30 },

    // High jump + block
    { type: 'block', x: 2200, y: CONFIG.GROUND_Y - 70, w: 60, h: 70 },
    { type: 'spike', x: 2300, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 2330, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 2360, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 2390, y: CONFIG.GROUND_Y, w: 30, h: 30 },

    // Floating platforms sequence
    { type: 'platform', x: 2550, y: CONFIG.GROUND_Y - 80, w: 90, h: 18 },
    { type: 'platform', x: 2700, y: CONFIG.GROUND_Y - 130, w: 90, h: 18 },
    { type: 'platform', x: 2850, y: CONFIG.GROUND_Y - 90, w: 90, h: 18 },
    { type: 'spike', x: 2980, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 3010, y: CONFIG.GROUND_Y, w: 30, h: 30 },

    // Gravity portal section
    { type: 'portal', x: 3200, y: CONFIG.GROUND_Y - 120, w: 40, h: 120, flip: true },
    { type: 'spike', x: 3400, y: 80, w: 30, h: 30, upsideDown: true },
    { type: 'spike', x: 3430, y: 80, w: 30, h: 30, upsideDown: true },
    { type: 'platform', x: 3550, y: 160, w: 140, h: 18 },
    { type: 'spike', x: 3720, y: 80, w: 30, h: 30, upsideDown: true },
    { type: 'portal', x: 3850, y: 80, w: 40, h: 120, flip: true }, // back to normal

    // Final challenge
    { type: 'spike', x: 4050, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 4080, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'block', x: 4200, y: CONFIG.GROUND_Y - 55, w: 50, h: 55 },
    { type: 'spike', x: 4300, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 4330, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 4360, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'platform', x: 4500, y: CONFIG.GROUND_Y - 100, w: 110, h: 18 },
    { type: 'spike', x: 4650, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 4680, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 4710, y: CONFIG.GROUND_Y, w: 30, h: 30 },
    { type: 'spike', x: 4740, y: CONFIG.GROUND_Y, w: 30, h: 30 },

    // Finish
    { type: 'finish', x: 5000, y: CONFIG.GROUND_Y - 180, w: 40, h: 180 },
  ];

  const LEVEL_END = 5100;

  // ====================== PARTICLES ======================
  let particles = [];

  function spawnParticles(x, y, color, count = 12, speed = 180) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const sp = speed * (0.4 + Math.random() * 0.8);
      particles.push({
        x, y,
        vx: Math.cos(angle) * sp,
        vy: Math.sin(angle) * sp,
        life: 0.5 + Math.random() * 0.5,
        maxLife: 0.5 + Math.random() * 0.5,
        size: 2 + Math.random() * 4,
        color,
      });
    }
  }

  // ====================== AUDIO ======================
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playTone(freq, duration, type = 'square', volume = 0.08) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playJump() {
    playTone(420, 0.08, 'square', 0.07);
    setTimeout(() => playTone(620, 0.06, 'square', 0.05), 40);
  }

  function playDeath() {
    playTone(180, 0.25, 'sawtooth', 0.1);
    setTimeout(() => playTone(90, 0.3, 'sawtooth', 0.08), 80);
  }

  function playPortal() {
    playTone(300, 0.1, 'sine', 0.08);
    setTimeout(() => playTone(500, 0.12, 'sine', 0.07), 60);
    setTimeout(() => playTone(700, 0.15, 'sine', 0.06), 120);
  }

  function playWin() {
    [523, 659, 784, 1046].forEach((f, i) => {
      setTimeout(() => playTone(f, 0.2, 'square', 0.07), i * 120);
    });
  }

  // ====================== INPUT ======================
  let jumpPressed = false;
  let jumpBuffer = 0;

  function handleJump() {
    if (state === 'playing' && !player.dead) {
      jumpPressed = true;
      jumpBuffer = 0.12; // small buffer
    }
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (state === 'menu') startGame();
      else if (state === 'dead') restart();
      else if (state === 'win') restart();
      else handleJump();
    }
    if (e.code === 'KeyR' && (state === 'playing' || state === 'dead')) restart();
  });

  canvas.addEventListener('mousedown', e => {
    e.preventDefault();
    if (state === 'menu') startGame();
    else if (state === 'dead') restart();
    else if (state === 'win') restart();
    else handleJump();
  });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (state === 'menu') startGame();
    else if (state === 'dead') restart();
    else if (state === 'win') restart();
    else handleJump();
  }, { passive: false });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', restart);
  document.getElementById('againBtn').addEventListener('click', restart);

  // ====================== GAME LOGIC ======================
  let gravityDir = 1; // 1 = normal, -1 = upside down
  let cameraX = 0;

  function resetPlayer() {
    player.x = 100;
    player.y = CONFIG.GROUND_Y - CONFIG.PLAYER_SIZE;
    player.vy = 0;
    player.rotation = 0;
    player.onGround = true;
    player.dead = false;
    player.trail = [];
    gravityDir = 1;
    cameraX = 0;
    progress = 0;
    particles = [];
    shake = 0;
    // Reset portals
    for (const obj of level) {
      if (obj.type === 'portal') obj.used = false;
    }
  }

  function startGame() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    state = 'playing';
    attempt = 1;
    document.getElementById('attemptCount').textContent = attempt;
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('deathOverlay').classList.add('hidden');
    document.getElementById('winOverlay').classList.add('hidden');
    resetPlayer();
  }

  function restart() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    state = 'playing';
    attempt++;
    document.getElementById('attemptCount').textContent = attempt;
    document.getElementById('deathOverlay').classList.add('hidden');
    document.getElementById('winOverlay').classList.add('hidden');
    resetPlayer();
  }

  function die() {
    if (player.dead) return;
    player.dead = true;
    state = 'dead';
    playDeath();
    shake = 18;
    spawnParticles(player.x + CONFIG.PLAYER_SIZE / 2, player.y + CONFIG.PLAYER_SIZE / 2, '#ff3366', 28, 320);
    spawnParticles(player.x + CONFIG.PLAYER_SIZE / 2, player.y + CONFIG.PLAYER_SIZE / 2, '#ffffff', 12, 200);

    const pct = Math.floor(progress * 100);
    document.getElementById('deathProgress').textContent = pct;
    if (pct > bestProgress) {
      bestProgress = pct;
      localStorage.setItem('neonDashBest', bestProgress.toString());
      document.getElementById('bestProgress').textContent = bestProgress;
    }

    setTimeout(() => {
      if (state === 'dead') {
        document.getElementById('deathOverlay').classList.remove('hidden');
      }
    }, 600);
  }

  function win() {
    state = 'win';
    playWin();
    spawnParticles(player.x + CONFIG.PLAYER_SIZE / 2, player.y + CONFIG.PLAYER_SIZE / 2, '#00ffc8', 40, 280);
    document.getElementById('winAttempts').textContent = attempt;
    bestProgress = 100;
    localStorage.setItem('neonDashBest', '100');
    document.getElementById('bestProgress').textContent = '100';
    setTimeout(() => {
      document.getElementById('winOverlay').classList.remove('hidden');
    }, 400);
  }

  // Collision helpers
  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function getPlayerRect() {
    // Slightly smaller hitbox for fairness (Geometry Dash style)
    const pad = 4;
    return {
      x: player.x + pad,
      y: player.y + pad,
      w: CONFIG.PLAYER_SIZE - pad * 2,
      h: CONFIG.PLAYER_SIZE - pad * 2,
    };
  }

  function update(dt) {
    if (state !== 'playing' || player.dead) {
      // still update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      if (shake > 0) {
        shake *= Math.pow(0.9, dt * 60);
        if (shake < 0.3) shake = 0;
      }
      return;
    }

    // Jump buffer
    if (jumpBuffer > 0) jumpBuffer -= dt;

    // Horizontal movement (constant)
    player.x += CONFIG.RUN_SPEED * dt;

    // Jump
    if ((jumpPressed || jumpBuffer > 0) && player.onGround) {
      player.vy = CONFIG.JUMP_FORCE * gravityDir;
      player.onGround = false;
      playJump();
      spawnParticles(
        player.x + CONFIG.PLAYER_SIZE / 2,
        gravityDir === 1 ? player.y + CONFIG.PLAYER_SIZE : player.y,
        '#00ffc8',
        10,
        140
      );
      jumpBuffer = 0;
    }
    jumpPressed = false;

    // Gravity
    player.vy += CONFIG.GRAVITY * gravityDir * dt;
    player.y += player.vy * dt;

    // Rotation while airborne
    if (!player.onGround) {
      player.rotation += CONFIG.ROTATION_SPEED * gravityDir * dt;
    } else {
      // Snap rotation to nearest 90 degrees
      const target = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
      player.rotation += (target - player.rotation) * Math.min(1, 20 * dt);
    }

    // Ground / ceiling collision
    const groundY = CONFIG.GROUND_Y - CONFIG.PLAYER_SIZE;
    const ceilingY = 40;

    if (gravityDir === 1) {
      if (player.y >= groundY) {
        player.y = groundY;
        player.vy = 0;
        player.onGround = true;
      }
      if (player.y < ceilingY) {
        player.y = ceilingY;
        player.vy = 0;
      }
    } else {
      if (player.y <= ceilingY) {
        player.y = ceilingY;
        player.vy = 0;
        player.onGround = true;
      }
      if (player.y > groundY) {
        player.y = groundY;
        player.vy = 0;
      }
    }

    // Platform / block collisions
    player.onGround = player.onGround; // keep previous if still valid
    const pRect = getPlayerRect();

    for (const obj of level) {
      if (obj.type === 'platform' || obj.type === 'block') {
        const oRect = { x: obj.x, y: obj.y, w: obj.w, h: obj.h };

        if (rectsOverlap(pRect, oRect)) {
          // Resolve collision based on velocity and gravity
          if (gravityDir === 1) {
            // Landing on top
            if (player.vy > 0 && player.y + CONFIG.PLAYER_SIZE - player.vy * dt <= obj.y + 8) {
              player.y = obj.y - CONFIG.PLAYER_SIZE;
              player.vy = 0;
              player.onGround = true;
            }
            // Hitting underside
            else if (player.vy < 0 && player.y - player.vy * dt >= obj.y + obj.h - 8) {
              player.y = obj.y + obj.h;
              player.vy = 0;
            }
            // Side
            else {
              die();
              return;
            }
          } else {
            // Upside down gravity
            if (player.vy < 0 && player.y - player.vy * dt >= obj.y + obj.h - 8) {
              player.y = obj.y + obj.h;
              player.vy = 0;
              player.onGround = true;
            } else if (player.vy > 0 && player.y + CONFIG.PLAYER_SIZE - player.vy * dt <= obj.y + 8) {
              player.y = obj.y - CONFIG.PLAYER_SIZE;
              player.vy = 0;
            } else {
              die();
              return;
            }
          }
        }
      }

      // Spikes
      if (obj.type === 'spike') {
        const spikeHit = {
          x: obj.x + 4,
          y: obj.upsideDown ? obj.y : obj.y - obj.h + 6,
          w: obj.w - 8,
          h: obj.h - 6,
        };
        if (rectsOverlap(pRect, spikeHit)) {
          die();
          return;
        }
      }

      // Portal
      if (obj.type === 'portal') {
        const portalRect = { x: obj.x, y: obj.y, w: obj.w, h: obj.h };
        if (rectsOverlap(pRect, portalRect) && !obj.used) {
          obj.used = true;
          gravityDir *= -1;
          player.vy *= 0.3;
          player.onGround = false;
          playPortal();
          spawnParticles(obj.x + obj.w / 2, obj.y + obj.h / 2, '#ff00aa', 20, 220);
        }
      }

      // Finish
      if (obj.type === 'finish') {
        if (player.x + CONFIG.PLAYER_SIZE > obj.x) {
          win();
          return;
        }
      }
    }

    // Trail
    player.trail.push({
      x: player.x + CONFIG.PLAYER_SIZE / 2,
      y: player.y + CONFIG.PLAYER_SIZE / 2,
      life: 0.35,
    });
    if (player.trail.length > 18) player.trail.shift();
    for (const t of player.trail) t.life -= dt;

    // Progress
    progress = Math.min(1, player.x / LEVEL_END);
    document.getElementById('progressBar').style.width = (progress * 100) + '%';

    // Camera
    cameraX = player.x - CONFIG.CAMERA_OFFSET_X;

    // Particles update
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 600 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Screen shake decay
    if (shake > 0) {
      shake *= Math.pow(0.88, dt * 60);
      if (shake < 0.4) shake = 0;
    }
  }

  // ====================== DRAWING ======================
  function drawBackground() {
    // Deep space gradient
    const grad = ctx.createLinearGradient(0, 0, 0, CONFIG.HEIGHT);
    grad.addColorStop(0, '#07071a');
    grad.addColorStop(0.6, '#0c0c22');
    grad.addColorStop(1, '#050510');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

    // Parallax stars / speed lines
    ctx.save();
    ctx.globalAlpha = 0.35;
    for (let i = 0; i < 40; i++) {
      const sx = ((i * 97 - cameraX * 0.3) % (CONFIG.WIDTH + 100)) - 50;
      const sy = (i * 53) % CONFIG.HEIGHT;
      ctx.fillStyle = i % 3 === 0 ? '#00ffc8' : '#ffffff';
      ctx.beginPath();
      ctx.arc(sx, sy, i % 4 === 0 ? 1.8 : 1, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Moving grid lines for speed feel
    ctx.save();
    ctx.strokeStyle = 'rgba(0, 255, 200, 0.06)';
    ctx.lineWidth = 1;
    const grid = 80;
    const offset = - (cameraX * 0.5) % grid;
    for (let x = offset; x < CONFIG.WIDTH + grid; x += grid) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, CONFIG.HEIGHT);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGround() {
    // Ground fill
    ctx.fillStyle = '#12122a';
    ctx.fillRect(0, CONFIG.GROUND_Y, CONFIG.WIDTH, CONFIG.HEIGHT - CONFIG.GROUND_Y);

    // Neon ground line
    ctx.strokeStyle = '#00ffc8';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#00ffc8';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, CONFIG.GROUND_Y);
    ctx.lineTo(CONFIG.WIDTH, CONFIG.GROUND_Y);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Ceiling line (for upside down)
    ctx.strokeStyle = 'rgba(255, 0, 170, 0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 40);
    ctx.lineTo(CONFIG.WIDTH, 40);
    ctx.stroke();
  }

  function drawPlayer() {
    const px = player.x - cameraX;
    const py = player.y;

    // Trail
    for (let i = 0; i < player.trail.length; i++) {
      const t = player.trail[i];
      if (t.life <= 0) continue;
      const alpha = t.life / 0.35;
      ctx.globalAlpha = alpha * 0.5;
      ctx.fillStyle = '#00ffc8';
      ctx.beginPath();
      ctx.arc(t.x - cameraX, t.y, 4 * alpha, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Player cube
    ctx.save();
    ctx.translate(px + CONFIG.PLAYER_SIZE / 2, py + CONFIG.PLAYER_SIZE / 2);
    ctx.rotate(player.rotation);

    // Glow
    ctx.shadowColor = '#00ffc8';
    ctx.shadowBlur = 18;

    // Body
    const half = CONFIG.PLAYER_SIZE / 2;
    ctx.fillStyle = '#00ffc8';
    ctx.fillRect(-half, -half, CONFIG.PLAYER_SIZE, CONFIG.PLAYER_SIZE);

    // Inner detail
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0a0a18';
    ctx.fillRect(-half + 6, -half + 6, CONFIG.PLAYER_SIZE - 12, CONFIG.PLAYER_SIZE - 12);

    // Eye / face accent
    ctx.fillStyle = '#00ffc8';
    ctx.fillRect(-4, -6, 8, 5);
    ctx.fillRect(-6, 2, 4, 4);
    ctx.fillRect(2, 2, 4, 4);

    ctx.restore();
  }

  function drawObject(obj) {
    const ox = obj.x - cameraX;
    if (ox + obj.w < -50 || ox > CONFIG.WIDTH + 50) return;

    if (obj.type === 'spike') {
      ctx.save();
      ctx.shadowColor = '#ff3366';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ff3366';
      ctx.beginPath();
      if (obj.upsideDown) {
        ctx.moveTo(ox, obj.y + obj.h);
        ctx.lineTo(ox + obj.w / 2, obj.y);
        ctx.lineTo(ox + obj.w, obj.y + obj.h);
      } else {
        ctx.moveTo(ox, obj.y);
        ctx.lineTo(ox + obj.w / 2, obj.y - obj.h);
        ctx.lineTo(ox + obj.w, obj.y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
    else if (obj.type === 'block' || obj.type === 'platform') {
      ctx.save();
      ctx.shadowColor = obj.type === 'platform' ? '#00aaff' : '#00ffc8';
      ctx.shadowBlur = 8;
      ctx.fillStyle = obj.type === 'platform' ? '#00aaff' : '#00ffc8';
      ctx.fillRect(ox, obj.y, obj.w, obj.h);
      ctx.shadowBlur = 0;

      // Inner darker
      ctx.fillStyle = '#0a0a18';
      ctx.fillRect(ox + 4, obj.y + 4, obj.w - 8, obj.h - 8);
      ctx.restore();
    }
    else if (obj.type === 'portal') {
      // Vertical portal
      const grad = ctx.createLinearGradient(ox, obj.y, ox + obj.w, obj.y);
      grad.addColorStop(0, 'rgba(255,0,170,0)');
      grad.addColorStop(0.5, '#ff00aa');
      grad.addColorStop(1, 'rgba(255,0,170,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(ox, obj.y, obj.w, obj.h);

      // Glow rings
      ctx.strokeStyle = '#ff00aa';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#ff00aa';
      ctx.shadowBlur = 15;
      ctx.strokeRect(ox + 4, obj.y + 10, obj.w - 8, obj.h - 20);
      ctx.shadowBlur = 0;
    }
    else if (obj.type === 'finish') {
      // Finish flag / beam
      ctx.save();
      ctx.shadowColor = '#00ffc8';
      ctx.shadowBlur = 20;
      const grad = ctx.createLinearGradient(ox, obj.y, ox, obj.y + obj.h);
      grad.addColorStop(0, 'rgba(0,255,200,0.8)');
      grad.addColorStop(1, 'rgba(0,255,200,0.1)');
      ctx.fillStyle = grad;
      ctx.fillRect(ox, obj.y, obj.w, obj.h);

      // Checkered pattern
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 6; i++) {
        for (let j = 0; j < 2; j++) {
          if ((i + j) % 2 === 0) {
            ctx.fillRect(ox + j * 20, obj.y + i * 30, 20, 30);
          }
        }
      }
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x - cameraX, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    // Shake
    ctx.save();
    if (shake > 0) {
      const sx = (Math.random() - 0.5) * shake;
      const sy = (Math.random() - 0.5) * shake;
      ctx.translate(sx, sy);
    }

    drawBackground();
    drawGround();

    // Draw level objects
    for (const obj of level) {
      drawObject(obj);
    }

    // Player
    if (!player.dead || state === 'playing') {
      drawPlayer();
    }

    drawParticles();

    ctx.restore();
  }

  // ====================== LOOP ======================
  function resize() {
    const container = document.getElementById('gameContainer');
    const rect = container.getBoundingClientRect();
    const scale = Math.min(rect.width / CONFIG.WIDTH, rect.height / CONFIG.HEIGHT);
    canvas.width = CONFIG.WIDTH;
    canvas.height = CONFIG.HEIGHT;
    // CSS handles the display size
  }

  window.addEventListener('resize', resize);
  resize();

  // Update best progress display
  document.getElementById('bestProgress').textContent = Math.floor(bestProgress);

  function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    dt = Math.min(dt, 0.05); // cap

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
