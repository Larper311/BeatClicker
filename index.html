<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Neon Dash — Geometry Dash</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;600;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#02020a;overflow:hidden;font-family:'Exo 2',system-ui,sans-serif;color:#fff;height:100vh;width:100vw;display:flex;justify-content:center;align-items:center;touch-action:none;user-select:none}
  #gameContainer{position:relative;width:100%;height:100%;max-width:1280px;max-height:720px;box-shadow:0 0 100px rgba(0,255,200,0.1);border-radius:12px;overflow:hidden}
  canvas{display:block;width:100%;height:100%;background:#050510}
  #ui{position:absolute;inset:0;pointer-events:none;padding:14px 18px}
  .top-bar{display:flex;justify-content:space-between;font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:1.5px;text-shadow:0 0 12px rgba(0,255,200,0.5)}
  .progress-container{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:42%;max-width:340px;height:7px;background:rgba(255,255,255,0.07);border-radius:4px;overflow:hidden;border:1px solid rgba(0,255,200,0.12)}
  .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#00ffc8,#00b4ff);border-radius:4px;box-shadow:0 0 14px #00ffc8;transition:width .08s linear}
  .center-message{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:90%}
  .title{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(2.2rem,7vw,4.2rem);background:linear-gradient(135deg,#00ffc8,#00b4ff,#ff00aa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 28px rgba(0,255,200,0.4));margin-bottom:6px;letter-spacing:3px}
  .subtitle{font-size:.95rem;opacity:.7;margin-bottom:26px;letter-spacing:4px;text-transform:uppercase}
  .big-btn{pointer-events:auto;background:linear-gradient(135deg,#00ffc8,#00c4a0);color:#02020a;border:none;padding:14px 42px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.05rem;border-radius:50px;cursor:pointer;letter-spacing:1.5px;box-shadow:0 0 30px rgba(0,255,200,0.5);transition:transform .15s,box-shadow .15s;margin:6px}
  .big-btn:hover{transform:scale(1.05);box-shadow:0 0 45px rgba(0,255,200,0.7)}
  .big-btn:active{transform:scale(.96)}
  .level-btn{pointer-events:auto;background:rgba(0,255,200,0.08);border:2px solid rgba(0,255,200,0.35);color:#00ffc8;padding:16px 28px;font-family:'Orbitron',sans-serif;font-weight:700;font-size:1rem;border-radius:14px;cursor:pointer;letter-spacing:1px;transition:all .2s;margin:8px;min-width:240px;text-align:left}
  .level-btn:hover{background:rgba(0,255,200,0.18);border-color:#00ffc8;transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,255,200,0.25)}
  .level-btn .diff{font-size:.75rem;opacity:.7;margin-top:4px;letter-spacing:1px}
  .level-btn.hard{border-color:rgba(255,45,106,0.5);color:#ff6b9d}
  .level-btn.hard:hover{background:rgba(255,45,106,0.15);border-color:#ff2d6a;box-shadow:0 8px 25px rgba(255,45,106,0.25)}
  .hint{margin-top:20px;font-size:.85rem;opacity:.5}
  .death-text{font-family:'Orbitron',sans-serif;font-size:2.7rem;font-weight:900;color:#ff2d6a;text-shadow:0 0 35px rgba(255,45,106,0.7);margin-bottom:10px}
  .win-text{font-family:'Orbitron',sans-serif;font-size:2.5rem;font-weight:900;color:#00ffc8;text-shadow:0 0 35px rgba(0,255,200,0.7);margin-bottom:10px}
  .small{font-size:1rem;opacity:.85;margin-bottom:20px}
  #overlay,#deathOverlay,#winOverlay,#levelSelect{position:absolute;inset:0;background:rgba(2,2,10,0.82);display:flex;justify-content:center;align-items:center;pointer-events:auto;backdrop-filter:blur(6px)}
  .hidden{display:none!important}
  .controls-info{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:.8rem;opacity:.45;text-align:center}
  .mode-label{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:2px;opacity:.8;text-shadow:0 0 10px currentColor}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <div class="top-bar">
      <div>ATTEMPT <span id="attemptCount">1</span></div>
      <div class="mode-label" id="modeLabel">CUBE</div>
    </div>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
  </div>

  <div id="overlay">
    <div class="center-message">
      <div class="title">NEON DASH</div>
      <div class="subtitle">Geometry Dash Style</div>
      <button class="big-btn" id="playBtn">SELECT LEVEL</button>
      <div class="hint">Click / Space / Tap to Jump or Fly</div>
      <div class="controls-info">Best: L1 <span id="best1">0</span>% · L2 <span id="best2">0</span>%</div>
    </div>
  </div>

  <div id="levelSelect" class="hidden">
    <div class="center-message">
      <div class="title" style="font-size:clamp(1.8rem,5vw,2.8rem)">SELECT LEVEL</div>
      <div style="margin:20px 0">
        <button class="level-btn" id="level1Btn">
          01 — STEREO DAWN
          <div class="diff">NORMAL · CUBE + SHIP</div>
        </button>
        <button class="level-btn hard" id="level2Btn">
          02 — NEURAL ABYSS
          <div class="diff">INSANE DEMON · CUBE · SHIP · WAVE</div>
        </button>
      </div>
      <button class="big-btn" id="backBtn" style="background:rgba(255,255,255,0.1);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,0.2)">BACK</button>
    </div>
  </div>

  <div id="deathOverlay" class="hidden">
    <div class="center-message">
      <div class="death-text">CRASHED</div>
      <div class="small">Progress: <span id="deathProgress">0</span>%</div>
      <button class="big-btn" id="retryBtn">RETRY</button>
      <button class="big-btn" id="menuBtn" style="background:rgba(255,255,255,0.12);color:#fff;box-shadow:none">MENU</button>
    </div>
  </div>

  <div id="winOverlay" class="hidden">
    <div class="center-message">
      <div class="win-text">LEVEL COMPLETE!</div>
      <div class="small">Attempts: <span id="winAttempts">1</span></div>
      <button class="big-btn" id="againBtn">PLAY AGAIN</button>
      <button class="big-btn" id="menuBtn2" style="background:rgba(255,255,255,0.12);color:#fff;box-shadow:none">MENU</button>
    </div>
  </div>
</div>

  function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  function playTone(f,d,t='square',v=0.06){
    if(!audioCtx) return;
    try{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type=t; o.frequency.value=f;
      g.gain.setValueAtTime(v,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d);
    }catch(e){}
  }
  function playJump(){ playTone(500,0.06); setTimeout(()=>playTone(750,0.04),30); }
  function playDeath(){ playTone(150,0.2,'sawtooth',0.08); setTimeout(()=>playTone(70,0.25,'sawtooth',0.06),60); }
  function playPortal(){ playTone(300,0.08,'sine'); setTimeout(()=>playTone(500,0.1,'sine'),50); setTimeout(()=>playTone(750,0.12,'sine'),100); }
  function playWin(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.16),i*100)); }

  function spawn(x,y,color,n=12,spd=180){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, s=spd*(0.3+Math.random()*0.9);
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:0.4+Math.random()*0.35,max:0.4+Math.random()*0.35,size:2+Math.random()*3.5,color});
    }
  }

  function press(){
    if(state==='playing' && !player.dead){ holding=true; jumpBuffer=CONFIG.BUFFER; }
  }
  function release(){ holding=false; }

  window.addEventListener('keydown', e=>{
    if(['Space','ArrowUp','KeyW'].includes(e.code)){
      e.preventDefault();
      if(state==='menu') showLevelSelect();
      else if(state==='dead'||state==='win') restart();
      else press();
    }
    if(e.code==='KeyR' && (state==='playing'||state==='dead')) restart();
    if(e.code==='Escape') showMenu();
  });
  window.addEventListener('keyup', e=>{ if(['Space','ArrowUp','KeyW'].includes(e.code)) release(); });
  canvas.addEventListener('mousedown', e=>{ e.preventDefault(); if(state==='playing') press(); });
  canvas.addEventListener('mouseup', ()=> release());
  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); if(state==='playing') press(); else if(state==='menu') showLevelSelect(); }, {passive:false});
  canvas.addEventListener('touchend', ()=> release());

  document.getElementById('playBtn').onclick = showLevelSelect;
  document.getElementById('backBtn').onclick = showMenu;
  document.getElementById('level1Btn').onclick = ()=> startLevel(1);
  document.getElementById('level2Btn').onclick = ()=> startLevel(2);
  document.getElementById('retryBtn').onclick = restart;
  document.getElementById('againBtn').onclick = restart;
  document.getElementById('menuBtn').onclick = showMenu;
  document.getElementById('menuBtn2').onclick = showMenu;

  function showMenu(){
    state='menu';
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('levelSelect').classList.add('hidden');
    document.getElementById('deathOverlay').classList.add('hidden');
    document.getElementById('winOverlay').classList.add('hidden');
    document.getElementById('best1').textContent = Math.floor(best[1]);
    document.getElementById('best2').textContent = Math.floor(best[2]);
  }
  function showLevelSelect(){
    state='levelselect';
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('levelSelect').classList.remove('hidden');
  }
  function startLevel(n){
    initAudio(); if(audioCtx.state==='suspended') audioCtx.resume();
    currentLevel=n;
    levelData=(n===1?LEVEL1:LEVEL2).objects.map(o=>({...o}));
    levelEnd=(n===1?LEVEL1:LEVEL2).end;
    state='playing'; attempt=1;
    document.getElementById('attemptCount').textContent=attempt;
    document.getElementById('levelSelect').classList.add('hidden');
    document.getElementById('deathOverlay').classList.add('hidden');
    document.getElementById('winOverlay').classList.add('hidden');
    resetPlayer();
  }
  function restart(){
    initAudio(); if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
    state='playing'; attempt++;
    document.getElementById('attemptCount').textContent=attempt;
    document.getElementById('deathOverlay').classList.add('hidden');
    document.getElementById('winOverlay').classList.add('hidden');
    levelData=(currentLevel===1?LEVEL1:LEVEL2).objects.map(o=>({...o}));
    resetPlayer();
  }
  function resetPlayer(){
    player.x=90; player.y=CONFIG.GROUND_Y-CONFIG.PLAYER_SIZE;
    player.vy=0; player.rotation=0; player.onGround=true; player.dead=false; player.trail=[];
    gravityDir=1; mode='cube'; cameraX=0; cameraY=0; progress=0; particles=[]; shake=0;
    coyote=0; jumpBuffer=0; holding=false; updateModeLabel();
  }
  function die(){
    if(player.dead) return;
    player.dead=true; state='dead'; playDeath(); shake=15;
    const cx=player.x+16, cy=player.y+16;
    spawn(cx,cy,'#ff2d6a',30,320); spawn(cx,cy,'#fff',12,200);
    const pct=Math.floor(progress*100);
    document.getElementById('deathProgress').textContent=pct;
    if(pct>best[currentLevel]){ best[currentLevel]=pct; localStorage.setItem('nd_best'+currentLevel,String(pct)); }
    setTimeout(()=>{ if(state==='dead') document.getElementById('deathOverlay').classList.remove('hidden'); },500);
  }
  function win(){
    state='win'; playWin(); spawn(player.x+16,player.y+16,'#00ffc8',50,280);
    document.getElementById('winAttempts').textContent=attempt;
    best[currentLevel]=100; localStorage.setItem('nd_best'+currentLevel,'100');
    setTimeout(()=>document.getElementById('winOverlay').classList.remove('hidden'),350);
  }
  function updateModeLabel(){
    const el=document.getElementById('modeLabel');
    el.textContent=mode.toUpperCase();
    el.style.color=mode==='cube'?'#00ffc8':mode==='ship'?'#00b4ff':'#ff00aa';
  }

  function rects(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
  function hitbox(){
    const i=mode==='wave'?6:5;
    return {x:player.x+i,y:player.y+i,w:CONFIG.PLAYER_SIZE-i*2,h:CONFIG.PLAYER_SIZE-i*2};
  }

  function update(dt){
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=500*dt; p.life-=dt;
      if(p.life<=0) particles.splice(i,1);
    }
    if(shake>0){ shake*=Math.pow(0.86,dt*60); if(shake<0.3) shake=0; }
    if(state!=='playing'||player.dead) return;

    if(jumpBuffer>0) jumpBuffer-=dt;
    if(coyote>0) coyote-=dt;
    player.x += CONFIG.RUN_SPEED * dt;

    if(mode==='cube'){
      const canJump=player.onGround||coyote>0;
      if((holding||jumpBuffer>0)&&canJump){
        player.vy=CONFIG.JUMP_FORCE*gravityDir; player.onGround=false; coyote=0; jumpBuffer=0;
        playJump(); spawn(player.x+16,gravityDir===1?player.y+32:player.y,'#00ffc8',8,120);
      }
      player.vy += CONFIG.GRAVITY*gravityDir*dt;
      if(gravityDir===1&&player.vy>1300) player.vy=1300;
      if(gravityDir===-1&&player.vy<-1300) player.vy=-1300;
      player.y += player.vy*dt;
      if(!player.onGround) player.rotation += CONFIG.ROTATION_SPEED*gravityDir*dt;
      else { const sn=Math.round(player.rotation/(Math.PI/2))*(Math.PI/2); player.rotation+=(sn-player.rotation)*Math.min(1,16*dt); }
    }
    else if(mode==='ship'){
      if(holding) player.vy += CONFIG.SHIP_LIFT*dt;
      else player.vy += CONFIG.SHIP_GRAVITY*dt;
      player.vy = Math.max(-880,Math.min(880,player.vy));
      player.y += player.vy*dt;
      player.rotation = player.vy*0.00115;
    }
    else if(mode==='wave'){
      const dir = holding ? -1 : 1;
      player.vy = dir * CONFIG.WAVE_SPEED_Y;
      player.y += player.vy * dt;
      player.rotation = dir * 0.55;
    }

    const groundY=CONFIG.GROUND_Y-CONFIG.PLAYER_SIZE, ceilY=50;
    if(player.y>=groundY){ player.y=groundY; player.vy=0; if(mode==='cube'){player.onGround=true;coyote=CONFIG.COYOTE;} }
    else if(mode==='cube') player.onGround=false;
    if(player.y<=ceilY){ player.y=ceilY; player.vy=0; }

    const pr=hitbox();
    for(const obj of levelData){
      if(obj.type==='platform'||obj.type==='block'){
        const o={x:obj.x,y:obj.y,w:obj.w,h:obj.h};
        if(rects(pr,o)){
          if(mode==='cube'){
            if(player.vy>=0 && (player.y+CONFIG.PLAYER_SIZE-player.vy*dt)<=obj.y+14){
              player.y=obj.y-CONFIG.PLAYER_SIZE; player.vy=0; player.onGround=true; coyote=CONFIG.COYOTE;
            } else if(player.vy<0 && player.y-player.vy*dt>=obj.y+obj.h-12){
              player.y=obj.y+obj.h; player.vy=0;
            } else { die(); return; }
          } else { die(); return; }
        }
      }
      if(obj.type==='spike'){
        const hit={x:obj.x+4,y:obj.upsideDown?obj.y:obj.y-obj.h+6,w:obj.w-8,h:obj.h-7};
        if(rects(pr,hit)){ die(); return; }
      }
      if(obj.type==='portal'&&!obj.used){
        const por={x:obj.x,y:obj.y,w:obj.w,h:obj.h};
        if(rects(pr,por)){
          obj.used=true; mode=obj.mode||'cube'; player.vy*=0.3; player.onGround=false; coyote=0;
          playPortal();
          const col=mode==='ship'?'#00b4ff':mode==='wave'?'#ff00aa':'#00ffc8';
          spawn(obj.x+16,obj.y+70,col,24,230); updateModeLabel();
        }
      }
      if(obj.type==='finish'&&player.x+CONFIG.PLAYER_SIZE>obj.x){ win(); return; }
    }

    player.trail.push({x:player.x+16,y:player.y+16,life:0.28});
    if(player.trail.length>14) player.trail.shift();
    for(const t of player.trail) t.life-=dt;

    progress=Math.min(1,player.x/levelEnd);
    document.getElementById('progressBar').style.width=(progress*100)+'%';
    const tx=player.x-CONFIG.CAMERA_OFFSET_X;
    cameraX+=(tx-cameraX)*Math.min(1,9*dt);
    const ty=Math.max(0,(CONFIG.GROUND_Y-260)-player.y)*0.2;
    cameraY+=(ty-cameraY)*Math.min(1,5*dt);
  }

  function drawBG(){
    const g=ctx.createLinearGradient(0,0,0,CONFIG.HEIGHT);
    if(currentLevel===2){ g.addColorStop(0,'#0a0518'); g.addColorStop(0.5,'#120820'); g.addColorStop(1,'#080412'); }
    else { g.addColorStop(0,'#05051a'); g.addColorStop(0.5,'#09091f'); g.addColorStop(1,'#04040e'); }
    ctx.fillStyle=g; ctx.fillRect(0,0,CONFIG.WIDTH,CONFIG.HEIGHT);
    ctx.save(); ctx.globalAlpha=0.28;
    for(let i=0;i<60;i++){
      const sx=((i*91-cameraX*0.22)%(CONFIG.WIDTH+100))-50;
      const sy=(i*53+20)%CONFIG.HEIGHT;
      ctx.fillStyle=currentLevel===2?(i%4===0?'#ff00aa':'#a070ff'):(i%4===0?'#00ffc8':'#88aaff');
      ctx.beginPath(); ctx.arc(sx,sy,i%5===0?1.7:0.9,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    ctx.save(); ctx.globalAlpha=currentLevel===2?0.07:0.045; ctx.strokeStyle=currentLevel===2?'#ff00aa':'#00ffc8'; ctx.lineWidth=1;
    const grid=65, off=-(cameraX*0.4)%grid;
    for(let x=off;x<CONFIG.WIDTH+grid;x+=grid){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CONFIG.HEIGHT); ctx.stroke(); }
    ctx.restore();
  }

  function drawGround(){
    ctx.fillStyle=currentLevel===2?'#100818':'#0d0d22';
    ctx.fillRect(0,CONFIG.GROUND_Y-cameraY,CONFIG.WIDTH,CONFIG.HEIGHT-CONFIG.GROUND_Y+50);
    ctx.strokeStyle=currentLevel===2?'#ff00aa':'#00ffc8';
    ctx.lineWidth=3; ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.moveTo(0,CONFIG.GROUND_Y-cameraY); ctx.lineTo(CONFIG.WIDTH,CONFIG.GROUND_Y-cameraY); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,0,170,0.4)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,50-cameraY); ctx.lineTo(CONFIG.WIDTH,50-cameraY); ctx.stroke();
  }

  function drawPlayer(){
    const px=player.x-cameraX, py=player.y-cameraY;
    for(const t of player.trail){
      if(t.life<=0) continue;
      const a=t.life/0.28; ctx.globalAlpha=a*0.4;
      ctx.fillStyle=mode==='ship'?'#00b4ff':mode==='wave'?'#ff00aa':'#00ffc8';
      ctx.beginPath(); ctx.arc(t.x-cameraX,t.y-cameraY,3.2*a,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.save();
    ctx.translate(px+CONFIG.PLAYER_SIZE/2, py+CONFIG.PLAYER_SIZE/2);
    ctx.rotate(player.rotation);
    const col=mode==='ship'?'#00b4ff':mode==='wave'?'#ff00aa':'#00ffc8';
    ctx.shadowColor=col; ctx.shadowBlur=18;
    if(mode==='cube'){
      const h=CONFIG.PLAYER_SIZE/2;
      ctx.fillStyle=col; ctx.fillRect(-h,-h,CONFIG.PLAYER_SIZE,CONFIG.PLAYER_SIZE);
      ctx.shadowBlur=0; ctx.fillStyle='#060612';
      ctx.fillRect(-h+5,-h+5,CONFIG.PLAYER_SIZE-10,CONFIG.PLAYER_SIZE-10);
      ctx.fillStyle=col; ctx.fillRect(-5,-6,10,4); ctx.fillRect(-6,2,5,5); ctx.fillRect(1,2,5,5);
    } else if(mode==='ship'){
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(-14,-12); ctx.lineTo(-8,0); ctx.lineTo(-14,12); ctx.closePath(); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle='#060612';
      ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-6,-6); ctx.lineTo(-3,0); ctx.lineTo(-6,6); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(12,0); ctx.lineTo(0,14); ctx.lineTo(-12,0); ctx.closePath(); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle='#060612';
      ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(6,0); ctx.lineTo(0,7); ctx.lineTo(-6,0); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawObj(obj){
    const ox=obj.x-cameraX, oy=obj.y-cameraY;
    if(ox+(obj.w||40)<-50||ox>CONFIG.WIDTH+50) return;
    if(obj.type==='spike'){
      ctx.save(); ctx.shadowColor='#ff2d6a'; ctx.shadowBlur=11; ctx.fillStyle='#ff2d6a';
      ctx.beginPath();
      if(obj.upsideDown){ ctx.moveTo(ox,oy+obj.h); ctx.lineTo(ox+obj.w/2,oy); ctx.lineTo(ox+obj.w,oy+obj.h); }
      else { ctx.moveTo(ox,oy); ctx.lineTo(ox+obj.w/2,oy-obj.h); ctx.lineTo(ox+obj.w,oy); }
      ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; ctx.restore();
    } else if(obj.type==='block'||obj.type==='platform'){
      const c=obj.type==='platform'?'#00b4ff':(currentLevel===2?'#c040ff':'#00ffc8');
      ctx.save(); ctx.shadowColor=c; ctx.shadowBlur=9; ctx.fillStyle=c;
      ctx.fillRect(ox,oy,obj.w,obj.h); ctx.shadowBlur=0;
      ctx.fillStyle='#060612'; ctx.fillRect(ox+3,oy+3,obj.w-6,obj.h-6); ctx.restore();
    } else if(obj.type==='portal'){
      const col=obj.mode==='ship'?'#00b4ff':obj.mode==='wave'?'#ff00aa':'#00ffc8';
      const g=ctx.createLinearGradient(ox,oy,ox+obj.w,oy);
      g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(0.5,col); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(ox,oy,obj.w,obj.h);
      ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.shadowColor=col; ctx.shadowBlur=16;
      ctx.strokeRect(ox+4,oy+10,obj.w-8,obj.h-20); ctx.shadowBlur=0;
      ctx.fillStyle=col; ctx.font='bold 11px Orbitron'; ctx.textAlign='center';
      ctx.fillText(obj.mode==='ship'?'SHIP':obj.mode==='wave'?'WAVE':'CUBE', ox+obj.w/2, oy+obj.h/2+4);
    } else if(obj.type==='finish'){
      ctx.save(); ctx.shadowColor='#00ffc8'; ctx.shadowBlur=20;
      const g=ctx.createLinearGradient(ox,oy,ox,oy+obj.h);
      g.addColorStop(0,'rgba(0,255,200,0.9)'); g.addColorStop(1,'rgba(0,255,200,0.05)');
      ctx.fillStyle=g; ctx.fillRect(ox,oy,obj.w,obj.h);
      ctx.fillStyle='rgba(255,255,255,0.85)';
      for(let i=0;i<8;i++) for(let j=0;j<2;j++) if((i+j)%2===0) ctx.fillRect(ox+j*25,oy+i*26,25,26);
      ctx.restore();
    }
  }

  function render(){
    ctx.save();
    if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    drawBG(); drawGround();
    for(const o of levelData) drawObj(o);
    if(!player.dead||state==='playing') drawPlayer();
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x-cameraX,p.y-cameraY,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1; ctx.restore();
  }

  function resize(){ canvas.width=CONFIG.WIDTH; canvas.height=CONFIG.HEIGHT; }
  window.addEventListener('resize',resize); resize();
  document.getElementById('best1').textContent=Math.floor(best[1]);
  document.getElementById('best2').textContent=Math.floor(best[2]);

  function loop(ts){
    if(!lastTime) lastTime=ts;
    let dt=(ts-lastTime)/1000; lastTime=ts; dt=Math.min(dt,0.033);
    update(dt); render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
