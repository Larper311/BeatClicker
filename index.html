<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rhythm Game + Proper Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #08080e;
    color: #eee;
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  #toolbar {
    display: flex;
    gap: 10px;
    padding: 12px;
    background: #111;
    width: 100%;
    justify-content: center;
    border-bottom: 1px solid #222;
    z-index: 50;
  }
  button {
    background: #1c1c24;
    color: #ddd;
    border: 1px solid #333;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #2a2a35; }
  button.active { background: #2e7d32; border-color: #4caf50; color: white; }

  #container {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  #game {
    position: relative;
    width: 480px;
    height: 100%;
    background: #0e0e16;
    border-left: 2px solid #222;
    border-right: 2px solid #222;
    overflow: hidden;
  }

  /* ===== PLAY MODE ===== */
  .lane {
    position: absolute;
    top: 0;
    width: 120px;
    height: 100%;
    border-right: 1px solid #1c1c28;
  }
  .lane.flash { background: rgba(255,255,255,0.07); }

  .hit-line {
    position: absolute;
    bottom: 100px;
    left: 0;
    width: 100%;
    height: 5px;
    background: #fff;
    box-shadow: 0 0 12px #fff, 0 0 25px #88f;
    z-index: 20;
  }

  .note {
    position: absolute;
    width: 100px;
    left: 10px;
    border-radius: 7px;
    box-shadow: 0 0 14px currentColor;
  }
  .note-head {
    height: 26px;
    border-radius: 7px;
    width: 100%;
  }
  .note-body {
    width: 60%;
    margin-left: 20%;
    background: inherit;
    opacity: 0.55;
    border-radius: 0 0 6px 6px;
  }

  #score { position: absolute; top: 16px; left: 16px; font-size: 24px; z-index: 30; text-shadow: 0 0 8px black; }
  #combo { position: absolute; top: 46px; left: 16px; font-size: 18px; z-index: 30; text-shadow: 0 0 8px black; }
  #judgment {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 46px;
    font-weight: 700;
    opacity: 0;
    z-index: 40;
    pointer-events: none;
    text-shadow: 0 0 18px currentColor;
  }
  .keys {
    position: absolute;
    bottom: 30px;
    width: 100%;
    display: flex;
    justify-content: space-around;
    font-size: 17px;
    opacity: 0.4;
    z-index: 10;
  }

  .particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 50;
  }

  /* ===== EDITOR ===== */
  #editor {
    display: none;
    width: 480px;
    height: 100%;
    background: #0c0c14;
    overflow-y: auto;
    position: relative;
    border-left: 2px solid #222;
    border-right: 2px solid #222;
  }
  #editor-canvas {
    position: relative;
    width: 100%;
    height: 4000px; /* tall so you can scroll */
    background: repeating-linear-gradient(
      to bottom,
      #0c0c14 0px,
      #0c0c14 39px,
      #15151f 39px,
      #15151f 40px
    );
  }
  .editor-lane {
    position: absolute;
    top: 0;
    width: 120px;
    height: 100%;
    border-right: 1px solid #1a1a25;
  }
  .editor-note {
    position: absolute;
    width: 100px;
    left: 10px;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 0 10px currentColor;
  }
  .editor-note:hover { filter: brightness(1.3); }
  .editor-note .head {
    height: 22px;
    border-radius: 6px;
  }
  .editor-note .body {
    width: 55%;
    margin-left: 22.5%;
    opacity: 0.5;
    border-radius: 0 0 5px 5px;
  }
  .time-label {
    position: absolute;
    left: 4px;
    font-size: 11px;
    color: #555;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-play" class="active">▶ Play</button>
  <button id="btn-edit">✎ Editor</button>
  <button id="btn-clear">Clear All</button>
  <button id="btn-long">Long Note: OFF</button>
</div>

<div id="container">
  <!-- PLAY VIEW -->
  <div id="game">
    <div id="score">Score: 0</div>
    <div id="combo">Combo: 0</div>
    <div id="judgment"></div>
    <div class="hit-line"></div>
    <div class="keys"><span>D</span><span>F</span><span>J</span><span>K</span></div>
  </div>

  <!-- EDITOR VIEW -->
  <div id="editor">
    <div id="editor-canvas"></div>
  </div>
</div>

<script>
const game = document.getElementById('game');
const editor = document.getElementById('editor');
const editorCanvas = document.getElementById('editor-canvas');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const judgmentEl = document.getElementById('judgment');

const LANE_W = 120;
const NOTE_SPEED = 520;
const SPAWN_AHEAD = 1.6;
const HIT_Y = 540;
const PERFECT = 0.065;
const GOOD = 0.13;
const PX_PER_SEC = 80; // editor scale

const keys = ['d','f','j','k'];
const colors = ['#33d6ff','#ff5ab8','#ffd633','#5aff73'];

let mode = 'play';
let longMode = false;
let chart = [
  {t:1.0, lane:0, d:0},
  {t:1.5, lane:1, d:0},
  {t:2.1, lane:2, d:0.6},
  {t:2.8, lane:3, d:0},
  {t:3.3, lane:0, d:0},
  {t:3.8, lane:1, d:0.4},
  {t:4.5, lane:2, d:0},
  {t:5.0, lane:3, d:0},
];

let notes = [];
let chartIndex = 0;
let score = 0, combo = 0;
let startTime = null;
let playing = true;
let pressed = [false,false,false,false];

// Create play lanes
const laneEls = [];
for (let i=0;i<4;i++){
  const l = document.createElement('div');
  l.className = 'lane';
  l.style.left = (i*LANE_W)+'px';
  l.style.background = i%2===0 ? '#0c0c14' : '#10101a';
  game.appendChild(l);
  laneEls.push(l);
}

// Create editor lanes + time labels
for (let i=0;i<4;i++){
  const l = document.createElement('div');
  l.className = 'editor-lane';
  l.style.left = (i*LANE_W)+'px';
  editorCanvas.appendChild(l);
}
for (let t=0; t<50; t++){
  const label = document.createElement('div');
  label.className = 'time-label';
  label.style.top = (t * PX_PER_SEC) + 'px';
  label.textContent = t.toFixed(1) + 's';
  editorCanvas.appendChild(label);
}

// ========== EFFECTS ==========
function particles(x, y, color, n=14){
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = x+'px';
    p.style.top = y+'px';
    p.style.background = color;
    p.style.boxShadow = `0 0 6px ${color}`;
    game.appendChild(p);
    const ang = Math.random()*Math.PI*2;
    const spd = 70 + Math.random()*110;
    let vx = Math.cos(ang)*spd, vy = Math.sin(ang)*spd - 50;
    let life = 1;
    const tick = () => {
      life -= 0.028;
      if(life<=0){p.remove();return;}
      p.style.left = (parseFloat(p.style.left)+vx*0.016)+'px';
      p.style.top = (parseFloat(p.style.top)+vy*0.016)+'px';
      p.style.opacity = life;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
}
function flash(lane){
  laneEls[lane].classList.add('flash');
  setTimeout(()=>laneEls[lane].classList.remove('flash'),70);
}
function shake(){
  game.style.transform = `translate(${(Math.random()-0.5)*7}px,${(Math.random()-0.5)*5}px)`;
  setTimeout(()=>game.style.transform='',40);
}
function showJudgment(text,col){
  judgmentEl.textContent = text;
  judgmentEl.style.color = col;
  judgmentEl.style.opacity = 1;
  judgmentEl.style.transform = 'translateX(-50%) scale(1.25)';
  setTimeout(()=>{
    judgmentEl.style.transition = 'all 0.3s';
    judgmentEl.style.opacity = 0;
    judgmentEl.style.transform = 'translateX(-50%) scale(0.85)';
  },60);
}

// ========== PLAY LOGIC ==========
function spawnNote(data){
  const el = document.createElement('div');
  el.className = 'note';
  el.style.color = colors[data.lane];
  el.style.left = (data.lane*LANE_W + 10)+'px';

  const head = document.createElement('div');
  head.className = 'note-head';
  head.style.background = colors[data.lane];
  el.appendChild(head);

  if(data.d > 0){
    const body = document.createElement('div');
    body.className = 'note-body';
    body.style.height = (data.d * NOTE_SPEED) + 'px';
    body.style.background = colors[data.lane];
    el.appendChild(body);
  }

  el.style.top = (HIT_Y - SPAWN_AHEAD*NOTE_SPEED) + 'px';
  game.appendChild(el);

  notes.push({
    el, lane: data.lane, time: data.t, duration: data.d||0,
    y: HIT_Y - SPAWN_AHEAD*NOTE_SPEED, active: true
  });
}

function hit(n, judgment, pts){
  n.active = false;
  score += pts;
  combo++;
  flash(n.lane);
  particles(n.lane*LANE_W+60, HIT_Y, colors[n.lane], judgment==='Perfect'?16:9);
  if(judgment==='Perfect') shake();

  n.el.style.transition = 'opacity 0.12s, transform 0.12s';
  n.el.style.opacity = 0;
  n.el.style.transform = 'scale(1.25)';
  setTimeout(()=>n.el.remove(),120);

  showJudgment(judgment, judgment==='Perfect'?'#7aff9e':'#ffd56a');
  updateUI();
}

function miss(){
  combo = 0;
  showJudgment('Miss','#ff5555');
  updateUI();
}

function tryHit(lane){
  if(mode!=='play'||!playing) return;
  const now = (performance.now()-startTime)/1000;
  let best=null, bestDiff=999;
  for(const n of notes){
    if(n.lane===lane && n.active){
      const diff = Math.abs(now - n.time);
      if(diff < bestDiff){ bestDiff=diff; best=n; }
    }
  }
  if(!best) return;
  if(bestDiff <= PERFECT) hit(best,'Perfect',300);
  else if(bestDiff <= GOOD) hit(best,'Good',100);
}

function updateUI(){
  scoreEl.textContent = 'Score: '+score;
  comboEl.textContent = 'Combo: '+combo;
}

function loop(ts){
  if(!startTime) startTime = ts;
  const now = (ts-startTime)/1000;

  if(playing && mode==='play'){
    while(chartIndex < chart.length && chart[chartIndex].t - SPAWN_AHEAD <= now){
      spawnNote(chart[chartIndex]);
      chartIndex++;
    }
    for(let i=notes.length-1;i>=0;i--){
      const n = notes[i];
      n.y += NOTE_SPEED/60;
      n.el.style.top = n.y+'px';
      if(n.y > HIT_Y+90 && n.active){
        n.active=false;
        miss();
        n.el.remove();
        notes.splice(i,1);
      }
    }
  }
  requestAnimationFrame(loop);
}

// Keyboard
document.addEventListener('keydown', e=>{
  const idx = keys.indexOf(e.key.toLowerCase());
  if(idx===-1) return;
  if(!pressed[idx]){
    pressed[idx]=true;
    tryHit(idx);
  }
});
document.addEventListener('keyup', e=>{
  const idx = keys.indexOf(e.key.toLowerCase());
  if(idx!==-1) pressed[idx]=false;
});

// ========== EDITOR ==========
function renderEditor(){
  // clear old notes
  editorCanvas.querySelectorAll('.editor-note').forEach(n=>n.remove());

  chart.forEach((data, index)=>{
    const el = document.createElement('div');
    el.className = 'editor-note';
    el.style.color = colors[data.lane];
    el.style.left = (data.lane*LANE_W + 10)+'px';
    el.style.top = (data.t * PX_PER_SEC) + 'px';

    const head = document.createElement('div');
    head.className = 'head';
    head.style.background = colors[data.lane];
    el.appendChild(head);

    if(data.d > 0){
      const body = document.createElement('div');
      body.className = 'body';
      body.style.height = (data.d * PX_PER_SEC) + 'px';
      body.style.background = colors[data.lane];
      el.appendChild(body);
    }

    // delete on right click
    el.oncontextmenu = e => {
      e.preventDefault();
      chart.splice(index,1);
      renderEditor();
    };

    editorCanvas.appendChild(el);
  });
}

let dragStart = null;

editorCanvas.addEventListener('mousedown', e=>{
  if(mode!=='edit') return;
  const rect = editorCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top + editor.scrollTop;
  const lane = Math.floor(x / LANE_W);
  if(lane<0||lane>3) return;

  const t = y / PX_PER_SEC;

  if(e.button === 0){ // left click
    if(longMode || e.shiftKey){
      // start long note drag
      dragStart = {t, lane};
    } else {
      chart.push({t: Math.max(0.2,t), lane, d:0});
      chart.sort((a,b)=>a.t-b.t);
      renderEditor();
    }
  }
});

editorCanvas.addEventListener('mouseup', e=>{
  if(!dragStart) return;
  const rect = editorCanvas.getBoundingClientRect();
  const y = e.clientY - rect.top + editor.scrollTop;
  const endT = y / PX_PER_SEC;
  const duration = Math.max(0.15, endT - dragStart.t);

  chart.push({t: dragStart.t, lane: dragStart.lane, d: duration});
  chart.sort((a,b)=>a.t-b.t);
  dragStart = null;
  renderEditor();
});

// ========== BUTTONS ==========
document.getElementById('btn-play').onclick = ()=>{
  mode = 'play';
  document.getElementById('btn-play').classList.add('active');
  document.getElementById('btn-edit').classList.remove('active');
  game.style.display = 'block';
  editor.style.display = 'none';

  // reset play
  notes.forEach(n=>n.el.remove());
  notes = [];
  chartIndex = 0;
  score = 0; combo = 0;
  startTime = null;
  playing = true;
  updateUI();
};

document.getElementById('btn-edit').onclick = ()=>{
  mode = 'edit';
  playing = false;
  document.getElementById('btn-edit').classList.add('active');
  document.getElementById('btn-play').classList.remove('active');
  game.style.display = 'none';
  editor.style.display = 'block';
  renderEditor();
};

document.getElementById('btn-clear').onclick = ()=>{
  chart = [];
  renderEditor();
};

document.getElementById('btn-long').onclick = function(){
  longMode = !longMode;
  this.textContent = 'Long Note: ' + (longMode?'ON':'OFF');
  this.classList.toggle('active', longMode);
};

// Start
requestAnimationFrame(loop);
</script>
</body>
</html>
