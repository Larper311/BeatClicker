<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rhythm Game - Fixed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #07070c;
    color: #eee;
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  #toolbar {
    display: flex;
    gap: 10px;
    padding: 12px;
    background: #111;
    width: 100%;
    justify-content: center;
    border-bottom: 1px solid #222;
    z-index: 100;
  }
  button {
    background: #1a1a22;
    color: #ddd;
    border: 1px solid #333;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #2a2a35; }
  button.active { background: #2e7d32; border-color: #4caf50; color: white; }

  #container {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }

  #game {
    position: relative;
    width: 480px;
    height: 100%;
    background: #0c0c14;
    border-left: 2px solid #222;
    border-right: 2px solid #222;
    overflow: hidden;
  }

  .lane {
    position: absolute;
    top: 0;
    width: 120px;
    height: 100%;
    border-right: 1px solid #1a1a25;
  }
  .lane.flash { background: rgba(255,255,255,0.08); }

  .hit-line {
    position: absolute;
    bottom: 110px;
    left: 0;
    width: 100%;
    height: 6px;
    background: #fff;
    box-shadow: 0 0 14px #fff, 0 0 28px #88f;
    z-index: 20;
  }

  .note {
    position: absolute;
    width: 100px;
    left: 10px;
    border-radius: 8px;
    box-shadow: 0 0 16px currentColor;
  }
  .note-head {
    height: 28px;
    border-radius: 8px;
    width: 100%;
  }
  .note-body {
    width: 58%;
    margin-left: 21%;
    opacity: 0.5;
    border-radius: 0 0 6px 6px;
  }

  #score { position: absolute; top: 18px; left: 18px; font-size: 26px; z-index: 30; text-shadow: 0 0 10px black; }
  #combo { position: absolute; top: 50px; left: 18px; font-size: 20px; z-index: 30; text-shadow: 0 0 10px black; }
  #judgment {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 48px;
    font-weight: 700;
    opacity: 0;
    z-index: 40;
    pointer-events: none;
    text-shadow: 0 0 20px currentColor;
  }
  .keys {
    position: absolute;
    bottom: 35px;
    width: 100%;
    display: flex;
    justify-content: space-around;
    font-size: 18px;
    opacity: 0.45;
    z-index: 10;
  }

  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 50;
  }

  /* EDITOR */
  #editor {
    display: none;
    width: 480px;
    height: 100%;
    background: #0a0a12;
    overflow-y: auto;
    border-left: 2px solid #222;
    border-right: 2px solid #222;
  }
  #editor-canvas {
    position: relative;
    width: 100%;
    height: 5000px;
    background: repeating-linear-gradient(
      to bottom,
      #0a0a12 0px,
      #0a0a12 47px,
      #12121c 47px,
      #12121c 48px
    );
  }
  .editor-lane {
    position: absolute;
    top: 0;
    width: 120px;
    height: 100%;
    border-right: 1px solid #1a1a25;
  }
  .editor-note {
    position: absolute;
    width: 100px;
    left: 10px;
    border-radius: 7px;
    cursor: pointer;
    box-shadow: 0 0 12px currentColor;
  }
  .editor-note:hover { filter: brightness(1.25); }
  .editor-note .head { height: 24px; border-radius: 7px; }
  .editor-note .body {
    width: 55%;
    margin-left: 22.5%;
    opacity: 0.5;
    border-radius: 0 0 5px 5px;
  }
  .time-label {
    position: absolute;
    left: 6px;
    font-size: 12px;
    color: #555;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-play" class="active">▶ Play</button>
  <button id="btn-edit">✎ Editor</button>
  <button id="btn-clear">Clear</button>
  <button id="btn-long">Long Note: OFF</button>
</div>

<div id="container">
  <div id="game">
    <div id="score">Score: 0</div>
    <div id="combo">Combo: 0</div>
    <div id="judgment"></div>
    <div class="hit-line"></div>
    <div class="keys"><span>D</span><span>F</span><span>J</span><span>K</span></div>
  </div>

  <div id="editor">
    <div id="editor-canvas"></div>
  </div>
</div>

<script>
const game = document.getElementById('game');
const editor = document.getElementById('editor');
const editorCanvas = document.getElementById('editor-canvas');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const judgmentEl = document.getElementById('judgment');

const LANE_W = 120;
const NOTE_SPEED = 380;          // slower = easier
const HIT_Y = 530;
const PERFECT_WINDOW = 0.09;
const GOOD_WINDOW = 0.16;
const PX_PER_SEC = 90;           // editor scale

const keys = ['d','f','j','k'];
const colors = ['#33d6ff','#ff5ab8','#ffd633','#5aff73'];

let mode = 'play';
let longMode = false;
let chart = [
  {t: 1.2, lane: 0, d: 0},
  {t: 1.8, lane: 1, d: 0},
  {t: 2.4, lane: 2, d: 0},
  {t: 3.0, lane: 3, d: 0},
  {t: 3.6, lane: 0, d: 0},
  {t: 4.0, lane: 2, d: 0.5},
  {t: 4.8, lane: 1, d: 0},
  {t: 5.4, lane: 3, d: 0},
  {t: 6.0, lane: 0, d: 0},
  {t: 6.6, lane: 1, d: 0},
];

let activeNotes = [];
let chartIndex = 0;
let score = 0, combo = 0;
let startTime = null;
let playing = true;
let pressed = [false, false, false, false];

// Create lanes
const laneEls = [];
for (let i = 0; i < 4; i++) {
  const l = document.createElement('div');
  l.className = 'lane';
  l.style.left = (i * LANE_W) + 'px';
  l.style.background = i % 2 === 0 ? '#0c0c14' : '#10101a';
  game.appendChild(l);
  laneEls.push(l);
}

// Editor setup
for (let i = 0; i < 4; i++) {
  const l = document.createElement('div');
  l.className = 'editor-lane';
  l.style.left = (i * LANE_W) + 'px';
  editorCanvas.appendChild(l);
}
for (let t = 0; t <= 60; t++) {
  const label = document.createElement('div');
  label.className = 'time-label';
  label.style.top = (t * PX_PER_SEC) + 'px';
  label.textContent = t + 's';
  editorCanvas.appendChild(label);
}

// ========== EFFECTS ==========
function particles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = color;
    p.style.boxShadow = `0 0 8px ${color}`;
    game.appendChild(p);

    const angle = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 100;
    let vx = Math.cos(angle) * speed;
    let vy = Math.sin(angle) * speed - 40;
    let life = 1;

    function tick() {
      life -= 0.03;
      if (life <= 0) { p.remove(); return; }
      p.style.left = (parseFloat(p.style.left) + vx * 0.016) + 'px';
      p.style.top = (parseFloat(p.style.top) + vy * 0.016) + 'px';
      p.style.opacity = life;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
}

function flashLane(lane) {
  laneEls[lane].classList.add('flash');
  setTimeout(() => laneEls[lane].classList.remove('flash'), 80);
}

function showJudgment(text, color) {
  judgmentEl.textContent = text;
  judgmentEl.style.color = color;
  judgmentEl.style.opacity = 1;
  judgmentEl.style.transform = 'translateX(-50%) scale(1.2)';
  setTimeout(() => {
    judgmentEl.style.transition = 'all 0.35s';
    judgmentEl.style.opacity = 0;
    judgmentEl.style.transform = 'translateX(-50%) scale(0.85)';
  }, 70);
}

// ========== CORE GAME ==========
function spawnNote(data) {
  const el = document.createElement('div');
  el.className = 'note';
  el.style.color = colors[data.lane];
  el.style.left = (data.lane * LANE_W + 10) + 'px';

  const head = document.createElement('div');
  head.className = 'note-head';
  head.style.background = colors[data.lane];
  el.appendChild(head);

  if (data.d > 0) {
    const body = document.createElement('div');
    body.className = 'note-body';
    body.style.height = (data.d * NOTE_SPEED) + 'px';
    body.style.background = colors[data.lane];
    el.appendChild(body);
  }

  game.appendChild(el);

  activeNotes.push({
    el,
    lane: data.lane,
    time: data.t,
    duration: data.d || 0,
    active: true
  });
}

function hitNote(n, judgment, points) {
  n.active = false;
  score += points;
  combo++;
  flashLane(n.lane);
  particles(n.lane * LANE_W + 60, HIT_Y, colors[n.lane], judgment === 'Perfect' ? 16 : 9);

  n.el.style.transition = 'opacity 0.12s, transform 0.12s';
  n.el.style.opacity = 0;
  n.el.style.transform = 'scale(1.3)';
  setTimeout(() => n.el.remove(), 120);

  showJudgment(judgment, judgment === 'Perfect' ? '#7aff9e' : '#ffd56a');
  updateUI();
}

function miss() {
  combo = 0;
  showJudgment('Miss', '#ff5555');
  updateUI();
}

function tryHit(lane) {
  if (mode !== 'play' || !playing) return;

  const now = (performance.now() - startTime) / 1000;
  let best = null;
  let bestDiff = 999;

  for (const n of activeNotes) {
    if (n.lane === lane && n.active) {
      const diff = Math.abs(now - n.time);
      if (diff < bestDiff) {
        bestDiff = diff;
        best = n;
      }
    }
  }

  if (!best) return;

  if (bestDiff <= PERFECT_WINDOW) {
    hitNote(best, 'Perfect', 300);
  } else if (bestDiff <= GOOD_WINDOW) {
    hitNote(best, 'Good', 100);
  }
}

function updateUI() {
  scoreEl.textContent = 'Score: ' + score;
  comboEl.textContent = 'Combo: ' + combo;
}

function gameLoop(timestamp) {
  if (!startTime) startTime = timestamp;
  const now = (timestamp - startTime) / 1000;

  if (playing && mode === 'play') {
    // Spawn notes a bit early
    while (chartIndex < chart.length && chart[chartIndex].t - 2.0 <= now) {
      spawnNote(chart[chartIndex]);
      chartIndex++;
    }

    // Position notes based on real time (this is the important fix)
    for (let i = activeNotes.length - 1; i >= 0; i--) {
      const n = activeNotes[i];
      const timeUntilHit = n.time - now;
      const y = HIT_Y - (timeUntilHit * NOTE_SPEED);

      n.el.style.top = y + 'px';

      // Miss if too late
      if (now > n.time + GOOD_WINDOW + 0.05 && n.active) {
        n.active = false;
        miss();
        n.el.remove();
        activeNotes.splice(i, 1);
      }
    }
  }

  requestAnimationFrame(gameLoop);
}

// Keyboard
document.addEventListener('keydown', e => {
  const idx = keys.indexOf(e.key.toLowerCase());
  if (idx === -1) return;
  if (!pressed[idx]) {
    pressed[idx] = true;
    tryHit(idx);
  }
});
document.addEventListener('keyup', e => {
  const idx = keys.indexOf(e.key.toLowerCase());
  if (idx !== -1) pressed[idx] = false;
});

// ========== EDITOR ==========
function renderEditor() {
  editorCanvas.querySelectorAll('.editor-note').forEach(n => n.remove());

  chart.forEach((data, index) => {
    const el = document.createElement('div');
    el.className = 'editor-note';
    el.style.color = colors[data.lane];
    el.style.left = (data.lane * LANE_W + 10) + 'px';
    el.style.top = (data.t * PX_PER_SEC) + 'px';

    const head = document.createElement('div');
    head.className = 'head';
    head.style.background = colors[data.lane];
    el.appendChild(head);

    if (data.d > 0) {
      const body = document.createElement('div');
      body.className = 'body';
      body.style.height = (data.d * PX_PER_SEC) + 'px';
      body.style.background = colors[data.lane];
      el.appendChild(body);
    }

    el.oncontextmenu = e => {
      e.preventDefault();
      chart.splice(index, 1);
      renderEditor();
    };

    editorCanvas.appendChild(el);
  });
}

let dragStart = null;

editorCanvas.addEventListener('mousedown', e => {
  if (mode !== 'edit') return;
  const rect = editorCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top + editor.scrollTop;
  const lane = Math.floor(x / LANE_W);
  if (lane < 0 || lane > 3) return;

  const t = y / PX_PER_SEC;

  if (e.button === 0) {
    if (longMode || e.shiftKey) {
      dragStart = { t, lane };
    } else {
      chart.push({ t: Math.max(0.3, t), lane, d: 0 });
      chart.sort((a, b) => a.t - b.t);
      renderEditor();
    }
  }
});

editorCanvas.addEventListener('mouseup', e => {
  if (!dragStart) return;
  const rect = editorCanvas.getBoundingClientRect();
  const y = e.clientY - rect.top + editor.scrollTop;
  const endT = y / PX_PER_SEC;
  const duration = Math.max(0.2, endT - dragStart.t);

  chart.push({ t: dragStart.t, lane: dragStart.lane, d: duration });
  chart.sort((a, b) => a.t - b.t);
  dragStart = null;
  renderEditor();
});

// ========== BUTTONS ==========
document.getElementById('btn-play').onclick = () => {
  mode = 'play';
  document.getElementById('btn-play').classList.add('active');
  document.getElementById('btn-edit').classList.remove('active');
  game.style.display = 'block';
  editor.style.display = 'none';

  activeNotes.forEach(n => n.el.remove());
  activeNotes = [];
  chartIndex = 0;
  score = 0;
  combo = 0;
  startTime = null;
  playing = true;
  updateUI();
};

document.getElementById('btn-edit').onclick = () => {
  mode = 'edit';
  playing = false;
  document.getElementById('btn-edit').classList.add('active');
  document.getElementById('btn-play').classList.remove('active');
  game.style.display = 'none';
  editor.style.display = 'block';
  renderEditor();
};

document.getElementById('btn-clear').onclick = () => {
  chart = [];
  renderEditor();
};

document.getElementById('btn-long').onclick = function () {
  longMode = !longMode;
  this.textContent = 'Long Note: ' + (longMode ? 'ON' : 'OFF');
  this.classList.toggle('active', longMode);
};

// Start
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
